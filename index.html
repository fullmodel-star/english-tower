<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="https://fullmodel-star.github.io/english-tower/">

<meta name="twitter:description" content="100層爬塔RPG，邊玩邊背單字。">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英語之塔</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#33507A">
<style>
  :root{
    /* 稜線品牌 v4.9 岩藍九階(深色版)：bg=navy-100 panel=navy-200 line=navy-500 line2=navy-300
       sub=navy-700 gold=破曉金#DE9A45。--good/--bad 是戰鬥回饋色(功能性例外，非品牌裝飾色) */
    --bg:#141E2B; --panel:#173140; --line:#52748A; --line2:#2C4459;
    --text:#EEF3F6; --sub:#92A9BA; --good:#3ad1a0; --bad:#ff5b6b; --gold:#DE9A45;
  }
  *{box-sizing:border-box;}
  html{font-size:15px;} /* 字級比原本稍微放大一些即可(18px放太大戰鬥畫面塞不進pad螢幕) */
  body{margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"Consolas","Cascadia Mono",monospace; padding:12px; font-size:1rem;}
  .wrap{max-width:760px; margin:0 auto;}
  .card{background:var(--panel); border:1px solid var(--line2); border-radius:10px; padding:14px; margin-bottom:10px;}
  .card.danger{border-color:var(--bad);}
  h1{font-size:1.4rem; letter-spacing:1px; margin:0 0 4px; color:var(--text);}
  h2{font-size:1.15rem; margin:0 0 6px; color:var(--text);}
  .sub{color:var(--sub); font-size:.95rem; margin-bottom:8px;}
  .sysmsg{border:1px dashed var(--line2); background:rgba(110,139,163,.10); padding:10px 12px; border-radius:6px; font-size:.95rem; color:var(--sub); margin:8px 0;}
  button{font-family:inherit; background:var(--line2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:.95rem; cursor:pointer; margin:4px 4px 4px 0;}
  button:hover{background:#3C5C71;}
  button:disabled{opacity:.35; cursor:default;}
  button.primary{background:var(--gold); color:#141E2B; font-weight:bold;}
  button.danger{background:var(--bad); color:#2a0508; font-weight:bold;}
  button.classBtn{display:block; width:100%; text-align:left; padding:12px; margin-bottom:8px;}
  input[type=text]{font-family:inherit; background:var(--bg); color:var(--text); border:1px solid var(--line2); border-radius:6px; padding:10px 12px; font-size:1.05rem;}
  .barwrap{background:var(--bg); border:1px solid var(--line2); border-radius:8px; height:18px; overflow:hidden; margin:4px 0;}
  .barfill{height:100%; background:#6E8BA3;}
  .barfill.boss{background:var(--bad);}
  .barfill.timer{background:var(--gold); transition:width .1s linear;}
  .barfill.counter{background:#ff9a3c; transition:width .1s linear;}
  .word{font-size:1.9rem; font-weight:bold; text-align:center; margin:8px 0 4px; color:var(--text);}
  .word.weak{color:var(--bad);}
  .word.golden{color:var(--gold);}
  .pos{text-align:center; color:var(--sub); font-size:.95rem; margin-bottom:8px;}
  .tagsRow{text-align:center; margin-bottom:4px;}
  .choices{display:grid; gap:8px;}
  .choice{background:var(--bg); border:1px solid var(--line2); border-radius:8px; padding:12px; font-size:1.1rem; text-align:left; color:var(--text);}
  .choice.correct{background:rgba(58,209,160,.2); border-color:var(--good);}
  .choice.wrong{background:rgba(255,91,107,.2); border-color:var(--bad);}
  .row{display:flex; justify-content:space-between; font-size:.95rem; color:var(--sub); margin:2px 0;}
  .lives{color:var(--bad); font-size:1.05rem;}
  .weapon,.gearRow,.petRow{border:1px solid var(--line2); border-radius:8px; padding:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
  .weapon.equipped,.petRow.active{border-color:var(--gold);}
  .tag{display:inline-block; font-size:.8rem; padding:2px 6px; border-radius:4px; background:var(--line2); color:var(--sub); margin-left:6px;}
  .tag.weak{background:#4a1030; color:var(--bad);}
  .tag.golden{background:#4a3a10; color:var(--gold);}
  .footer-nav{display:flex; gap:8px; flex-wrap:wrap;}
  /* ===== 首頁圖卡視覺化改版(小朋友反饋:首頁太像純文字清單,想要更像遊戲畫面)===== */
  .heroTop{display:flex; align-items:center; gap:12px;}
  .heroAvatar{width:56px; height:56px; border-radius:50%; background:var(--line2); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:1.8rem; flex-shrink:0; overflow:hidden;}
  .heroAvatar.awakened{border-color:var(--gold);}
  .pixelAvatar{width:80%; height:80%; image-rendering:pixelated; object-fit:contain;}
  .classIcon{width:1.3em; height:1.3em; image-rendering:pixelated; object-fit:contain; vertical-align:-0.3em; margin-right:2px;}
  .weaponIcon{width:28px; height:28px; image-rendering:pixelated; object-fit:contain; vertical-align:middle; margin-right:6px; flex-shrink:0;}
  .weaponIconSmall{width:1.2em; height:1.2em; image-rendering:pixelated; object-fit:contain; vertical-align:-0.25em; margin-right:3px;}
  .gearIconSmall{width:1.2em; height:1.2em; image-rendering:pixelated; object-fit:contain; vertical-align:-0.25em; margin-right:2px;}
  .gearIcon{width:26px; height:26px; image-rendering:pixelated; object-fit:contain; vertical-align:middle; margin-right:6px; flex-shrink:0;}
  .familySprite{width:1.3em; height:1.3em; image-rendering:pixelated; object-fit:contain; vertical-align:-0.3em;}
  .familySpriteBig{width:28px; height:28px; image-rendering:pixelated; object-fit:contain; vertical-align:middle;}
  .familySpriteParade{width:34px; height:34px; image-rendering:pixelated; object-fit:contain; display:block; margin:0 auto;}
  .heroInfo{flex:1; min-width:0;}
  .heroName{font-weight:bold; font-size:1.05rem;}
  .heroSub{color:var(--sub); font-size:.85rem; margin:2px 0 6px;}
  .homePetRow{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .homePetIcon{position:relative; font-size:1.2rem; background:var(--line2); border-radius:8px; padding:4px 8px; border:1px solid var(--line2);}
  .homePetIcon.awakened{border-color:var(--gold);}
  .homePetIcon .lv{font-size:.65rem; color:var(--gold); margin-left:2px;}
  .dragonBadge{display:flex; align-items:center; gap:8px; margin-top:8px; padding:8px 10px; border:1px dashed var(--line2);
    border-radius:8px; background:rgba(222,154,69,.07); cursor:pointer;}
  .dragonBadge .demoji{font-size:1.6rem;}
  .dragonBadge .dname{font-weight:bold;}
  /* ===== 龍窩畫面(小朋友反饋:精進龍蛋機制,做一個放大版的龍窩畫面)===== */
  .denHero{text-align:center; padding:10px 0;}
  .denEmoji{font-size:4rem; display:block; margin-bottom:4px;}
  .denBg-flame{background:radial-gradient(circle, rgba(255,90,40,.12), transparent 70%);}
  .denBg-frost{background:radial-gradient(circle, rgba(90,180,255,.12), transparent 70%);}
  .denBg-storm{background:radial-gradient(circle, rgba(190,120,255,.12), transparent 70%);}
  .denBg-shadow{background:radial-gradient(circle, rgba(140,90,255,.12), transparent 70%);}
  .denName{font-size:1.2rem; font-weight:bold; color:var(--gold);}
  .traitTag{display:inline-block; margin-top:6px; padding:3px 10px; border-radius:12px; background:var(--line2); color:var(--gold); font-size:.85rem;}
  .floorCard{text-align:center;}
  .floorBossEmoji{font-size:2.4rem; margin:4px 0;}
  /* 程序生成的樓層怪物 SVG(取代純 emoji)。尺寸跟著原本 emoji 的字級走,
     所以既有的 .bossEmoji 動畫/濾鏡(受擊晃動、相位變色、異色光暈)全部沿用,不必另外寫。 */
  .monsterSvg{width:1em; height:1em; display:block; overflow:visible;}
  .floorBossEmoji .monsterSvg{width:2.4rem; height:2.4rem; margin:0 auto;}
  .bossEmoji .monsterSvg{width:52px; height:52px;}
  .battleCard .bossEmoji .monsterSvg{width:46px; height:46px;}
  .epicMonsterEmoji{display:inline-block;}
  /* 宿敵現身:題目要一眼看出「就是這個字一直在整我」 */
  .word.nemesis{color:#ff6b81; text-shadow:0 0 12px rgba(255,107,129,.55);}
  .nemesisBanner{border:1px solid rgba(255,107,129,.5); background:rgba(255,107,129,.08);
    border-radius:8px; padding:6px 10px; margin:6px 0; font-size:.85rem;}
  .navSectionTitle{font-size:.8rem; color:var(--sub); margin:12px 0 6px; letter-spacing:2px;}
  .navGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px;}
  .navBtn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:10px 4px; font-size:.75rem; text-align:center; white-space:normal; margin:0;}
  .navBtn .navIcon{font-size:1.3rem;}
  .statRow{display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--line2); font-size:1rem;}
  textarea{width:100%; height:80px; font-family:inherit; background:var(--bg); color:var(--text); border:1px solid var(--line2); border-radius:6px; padding:10px; font-size:.95rem;}
  .toggleBtn{background:var(--bg);}
  .toggleBtn.on{background:var(--bad); color:#fff;}
  .blackout{background:#000; min-height:70vh; display:flex; flex-direction:column; justify-content:center; padding:28px;}
  .memLine{opacity:0; animation:fadeIn .8s ease forwards; margin:12px 0; font-size:1.05rem; color:#BECBD5;}
  .paradeRow{display:flex; flex-wrap:wrap; gap:12px; margin:16px 0;}
  .paradeItem{opacity:0; animation:popIn .5s ease forwards; font-size:2rem; text-align:center; width:64px;}
  .paradeItem .cap{font-size:.8rem; color:var(--sub); display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @keyframes popIn{from{opacity:0; transform:scale(.6);} to{opacity:1; transform:scale(1);}}
  .finalTitle{color:var(--gold); font-size:2rem; text-align:center; margin:20px 0; letter-spacing:4px;}

  /* ===== 戰鬥視覺(參考902_english2000三角洲模式手法:emoji大圖+CSS動畫,不需要美術資源)===== */
  .bossStage{position:relative; text-align:center; margin:2px 0; min-height:64px;}
  .bossEmoji{font-size:52px; display:inline-block; animation:towerFloat 2.4s ease-in-out infinite; filter:brightness(1);}
  .bossEmoji.phase2{filter:hue-rotate(60deg) saturate(1.3);}
  .bossEmoji.phase3{filter:hue-rotate(150deg) saturate(1.6);}
  .bossEmoji.shiny{animation:towerFloat 2.4s ease-in-out infinite, shinyGlow 1.6s ease-in-out infinite;}
  @keyframes shinyGlow{0%,100%{filter:drop-shadow(0 0 6px gold) hue-rotate(0deg);} 50%{filter:drop-shadow(0 0 14px gold) hue-rotate(40deg);}}
  .bossEmoji.shake{animation:towerFloat 2.4s ease-in-out infinite, bossShake .25s ease;}
  .bossEmoji.flash{animation:towerFloat 2.4s ease-in-out infinite, bossFlash .25s ease;}
  @keyframes towerFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);}}
  @keyframes bossShake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
  @keyframes bossFlash{0%,100%{filter:brightness(1);} 50%{filter:brightness(3) drop-shadow(0 0 16px #ff5b6b);}}
  .screenflash{position:fixed; inset:0; pointer-events:none; z-index:999; opacity:0;}
  .screenflash.good{background:rgba(58,209,160,.28); animation:flashFade .35s ease;}
  .screenflash.bad{background:rgba(255,40,40,.3); animation:flashFade .4s ease;}
  @keyframes flashFade{0%{opacity:1;} 100%{opacity:0;}}
  .fxLayer{position:relative; height:0;}
  .fx{position:absolute; left:50%; top:-60px; transform:translateX(-50%); pointer-events:none; font-size:34px;}
  .fx-assassin{width:120px; height:6px; background:linear-gradient(90deg,transparent,#fff,transparent); transform-origin:center; animation:fxSlash .4s ease forwards;}
  @keyframes fxSlash{0%{transform:translateX(-50%) scaleX(0) rotate(45deg); opacity:0;} 40%{opacity:1;} 100%{transform:translateX(-50%) scaleX(1) rotate(45deg); opacity:0;}}
  .fx-sniper{width:26px; height:26px; border:3px solid #ff5b6b; border-radius:50%; animation:fxScope .4s ease forwards;}
  @keyframes fxScope{0%{transform:translateX(-50%) scale(2.4); opacity:.2;} 60%{transform:translateX(-50%) scale(1); opacity:1;} 100%{opacity:0;}}
  .fx-guardian{width:20px; height:20px; border:3px solid #7d8cff; border-radius:50%; animation:fxShield .45s ease forwards;}
  @keyframes fxShield{0%{transform:translateX(-50%) scale(.3); opacity:1;} 100%{transform:translateX(-50%) scale(3.2); opacity:0;}}
  .fx-elem{position:absolute; left:50%; top:-40px; font-size:20px; animation:fxBurst .5s ease forwards;}
  @keyframes fxBurst{0%{transform:translate(-50%,0) scale(.6); opacity:1;} 100%{transform:translate(calc(-50% + var(--tx)), var(--ty)) scale(1.2); opacity:0;}}
  .petBattleRow{position:fixed; right:12px; bottom:12px; z-index:50; display:flex; gap:6px;}
  /* 小朋友反饋:寵物圖太小,要有攻擊感——放大(28px→36px),familySprite用em單位會跟著等比放大 */
  .petBattleIcon{position:relative; font-size:36px; transition:transform .2s;}
  .petBattleIcon .lv{position:absolute; bottom:-4px; right:-4px; font-size:9px; background:var(--line2); border-radius:50%; padding:1px 3px; color:var(--gold); line-height:1;}
  .petBattleIcon.lunge{animation:petLunge .35s ease;}
  @keyframes petLunge{0%{transform:translateX(0);} 40%{transform:translateX(-14px) scale(1.15);} 100%{transform:translateX(0);}}
  .petBattleIcon.awakened{filter:drop-shadow(0 0 6px var(--gold));}
  .petBattleIcon.shiny{animation:shinyGlow 1.6s ease-in-out infinite;}
  .floatText{position:fixed; left:50%; top:40%; transform:translateX(-50%); color:var(--gold); font-size:1.25rem; font-weight:bold;
    pointer-events:none; z-index:60; animation:floatUp 1s ease forwards;}
  .battleCry{position:fixed; left:50%; top:22%; transform:translateX(-50%); color:var(--gold); font-size:1.4rem; font-weight:bold;
    text-shadow:0 0 10px var(--gold); pointer-events:none; z-index:60; animation:floatUp .9s ease forwards;}
  @keyframes floatUp{0%{opacity:1; transform:translate(-50%,0);} 100%{opacity:0; transform:translate(-50%,-40px);}}
  .stars{color:var(--gold); font-size:.9rem; letter-spacing:1px;}
  .codexGrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(62px,1fr)); gap:6px; margin:10px 0;}
  .codexCell{background:var(--bg); border:1px solid var(--line2); border-radius:6px; padding:6px 2px; text-align:center;}
  .codexCell.locked{opacity:.35;}
  .codexEmoji{font-size:22px;}
  .codexName{font-size:.62rem; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ===== 塔地圖(小朋友反饋:100層只是數字,想要「我在塔的哪裡」的視覺呈現)===== */
  .towerMapGrid{display:grid; grid-template-columns:repeat(10, 1fr); gap:3px; margin:10px 0;}
  .mapCell{position:relative; aspect-ratio:1; border-radius:4px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:.65rem; background:var(--bg); border:1px solid var(--line2); opacity:.3;}
  .mapCell.cleared{opacity:1; cursor:pointer;}
  .mapCell.cleared:hover{filter:brightness(1.3);}
  .mapCell.current{opacity:1; border-color:var(--gold); animation:comboGlow 1.2s ease-in-out infinite;}
  .mapCell.rank-E{background:#0d2a1c;} .mapCell.rank-D{background:#2a2416;} .mapCell.rank-C{background:#3a1a12;}
  .mapCell.rank-B{background:#122a3a;} .mapCell.rank-A{background:#241640;} .mapCell.rank-S{background:#3a1030;}
  .mapCell.rank-決戰{background:#402008;}
  .mapCell.rank-傳說{background:#0d3a2a;} .mapCell.rank-神話{background:#3a2a08;} .mapCell.rank-終焉{background:#2a0d3a;}
  .mapFloorNum{font-weight:bold;}
  .mapIcon{font-size:.8rem; line-height:1;}
  .mapLegend{display:flex; flex-wrap:wrap; gap:10px; font-size:.8rem; color:var(--sub); margin:6px 0;}

  /* ===== 戰鬥刺激感加強(三位影音視覺專家會議建議,全部用疊加層/transform,不撐開版面高度) ===== */
  /* hit-stop:命中瞬間讓全站CSS動畫暫停一瞬間,是性價比最高的單一打擊感手法 */
  .hitstop *{animation-play-state:paused !important;}
  .bossEmoji.anticipate{animation:towerFloat 2.4s ease-in-out infinite, bossAnticipate .15s ease;}
  @keyframes bossAnticipate{50%{transform:scale(.94) translateY(2px);}}
  .bossEmoji.critpunch{animation:towerFloat 2.4s ease-in-out infinite, critPunch .3s ease;}
  @keyframes critPunch{0%{transform:scale(1);} 30%{transform:scale(1.35);} 60%{transform:scale(.92);} 100%{transform:scale(1);}}
  .bossEmoji.missed{animation:towerFloat 2.4s ease-in-out infinite, bossMiss .3s ease;}
  @keyframes bossMiss{0%{filter:grayscale(0) brightness(1); transform:translateX(0);} 40%{filter:grayscale(.5) brightness(.7); transform:translateX(-4px);} 100%{filter:grayscale(0) brightness(1); transform:translateX(0);}}
  .dmgNum{position:fixed; left:50%; top:32%; transform:translateX(-50%); color:#fff; font-weight:bold; font-size:1.3rem;
    pointer-events:none; z-index:70; animation:dmgPop .7s ease forwards; text-shadow:0 0 6px #000;}
  .dmgNum.crit{color:#ff9a3c; font-size:1.7rem;}
  @keyframes dmgPop{0%{transform:translate(-50%,0) scale(.6); opacity:0;} 20%{transform:translate(-50%,0) scale(1.3); opacity:1;} 100%{transform:translate(-50%,-50px) scale(1); opacity:0;}}
  .streakNum{display:inline-block; animation:streakBump .25s ease;}
  @keyframes streakBump{0%{transform:scale(1);} 40%{transform:scale(1.5); color:var(--bad);} 100%{transform:scale(1);}}
  .comboGlow5{box-shadow:0 0 14px 2px rgba(255,213,79,.5) inset; animation:comboGlow 1s ease-in-out infinite;}
  .comboGlow10{box-shadow:0 0 18px 3px rgba(255,91,107,.6) inset; animation:comboGlow .6s ease-in-out infinite;}
  @keyframes comboGlow{0%,100%{opacity:.6;} 50%{opacity:1;}}
  .counterVignette{position:fixed; inset:0; pointer-events:none; z-index:998;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(200,0,0,.35) 100%);}
  .card.danger.pulse{animation:dangerPulse .6s ease-in-out infinite;}
  @keyframes dangerPulse{0%,100%{transform:scale(1); filter:saturate(1);} 50%{transform:scale(1.015); filter:saturate(1.5);}}

  /* ===== 戰鬥畫面專用壓縮樣式(小朋友反饋:戰鬥畫面在pad上還是太大塞不下)=====
     只作用在答題/boss戰這張卡片上,選單/商店等畫面維持原本大小不受影響 */
  .card.battleCard{padding:8px;}
  .battleCard .bossStage{min-height:48px; margin:0;}
  /* 小朋友反饋:魔王圖太小沒有打擊感——維持pad不塞爆的前提下盡量放大(36px→46px) */
  .battleCard .bossEmoji{font-size:46px;}
  .battleCard .row{font-size:.8rem; margin:1px 0;}
  .battleCard .lives{font-size:.85rem;}
  .battleCard .barwrap{height:12px; margin:2px 0;}
  .battleCard .tagsRow{margin-bottom:1px;}
  .battleCard .tag{font-size:.7rem; padding:1px 5px;}
  .battleCard .word{font-size:1.4rem; margin:3px 0 1px;}
  .word.cloze{font-size:1.15rem; line-height:1.7; font-weight:normal;}
  .battleCard .pos{font-size:.8rem; margin-bottom:3px;}
  .battleCard .choices{gap:5px;}
  .battleCard .choice{padding:7px 10px; font-size:.95rem;}
  .battleCard .sub{font-size:.8rem; margin-bottom:3px;}
  .battleCard button{padding:6px 9px; font-size:.8rem; margin:2px 2px 2px 0;}

const SNIPER_ARCHETYPE_BY_BATCH = ["boltAction", "boltAction", "marksman", "modernSniper", "antiMateriel", "ultraLongRange"];

function buildClassWeapons(clsId) {
  const names = WEAPON_NAMES[clsId];
  const meta = CLASS_META[clsId];
  const weapons = [];
  let i = 0;
  for (let b = 0; b < BATCH_SIZES.length; b++) {
    for (let k = 0; k < BATCH_SIZES[b]; k++) {
      const variance = k % 3; // 同批次內小幅差異
      const dmg = Math.round(BATCH_DMG[b] * meta.dmgMult * (1 + variance * 0.08));
      const cost = Math.round(BATCH_COST[b] * (1 + variance * 0.25));
      const weapon = {
        id: clsId + "_" + i, name: names[i], dmg, cost,
        batch: b, unlockFloor: BATCH_FLOORS[b], rarity: RARITY_BY_BATCH[b],
      };
      if (clsId === "sniper") weapon.archetype = SNIPER_ARCHETYPE_BY_BATCH[b];
      weapons.push(weapon);
      i++;
    }
  }
  return weapons;
}

function masteryLevel(kc) { let lv = 0; for (let i = 0; i < MASTERY.length; i++) if (kc >= MASTERY[i].k) lv = i; return lv; }

    { tier: 8, name: "終焉・永恆徽章", cost: 10800, expBonusPct: 94, unlockFloor: 121 },

const GEAR_SLOTS = ["scope", "grip", "charm", "armor", "emblem"];
function gearTier(slot, t) { return GEAR_DATA[slot].tiers[Math.max(1, Math.min(GEAR_MAX_TIER, t)) - 1]; }
// 第4/5階要「爬到那層」才買得到,不是有錢就好——避免變成純粹的數字購買按鈕
function gearTierUnlocked(slot, t, floor) {
  const d = GEAR_DATA[slot].tiers[t - 1];
  if (!d) return false;
  return !d.unlockFloor || floor >= d.unlockFloor;
}
function gearEffPct(gearState) { return gearTier("scope", gearState.scope || 1).effPct || 0; }
function gearComboCut(gearState) { return gearTier("grip", gearState.grip || 1).comboCut || 0; }

// ---------- 傷害公式 ----------
// comboCap 預設 12;穿上「遺物握把」後會傳 EPIC_COMBO_CAP(16)
function calcDamage(weapon, weaponLv, killCount, streak, gearState, comboCap) {
  const base = weapon.dmg;
  const lvMult = 1 + LVL_BONUS[weaponLv];
  const masteryMult = 1 + MASTERY[masteryLevel(killCount)].bonus;
  const comboCut = gearState ? gearComboCut(gearState) : 0;
  const streakForMult = Math.min(streak + comboCut, comboCap || 12);
  const comboMult = 1 + streakForMult * 0.06;
  const gearMult = 1 + (gearState ? gearEffPct(gearState) / 100 : 0);
  // 狙擊手武器族passive(§927 archetype系統):只有weapon.archetype有值時才生效,
  // 非sniper職業的武器沒有這欄位,archetypeMult永遠是1,完全no-op。
  let archetypeMult = 1;
  if (weapon.archetype === "marksman" && streak >= 3) archetypeMult = 1.05;
  else if (weapon.archetype === "modernSniper") archetypeMult = 1.08;
  else if (weapon.archetype === "antiMateriel") archetypeMult = 1.15;
  return Math.round(base * lvMult * masteryMult * comboMult * gearMult * archetypeMult);
}

// ---------- 錯題本(8題間隔畢業規則)----------
// ⚠️ 真的bug,已修正:這裡原本沒有區分「曾經真的答錯過」跟「第一次就答對、只是還沒再遇到
// 第二次湊滿畢業條件」——導致每個玩家碰過的單字全部都會被記進本子(第一次答對streak才1,
// 還沒滿2次不算畢業),於是強制複習門檻(dueMistakeCount)會把「正常剛學到的新字」也當成
// 積欠的錯題,實測玩到第15層背包裡就有136個「未畢業」項目,而其中絕大多數從來沒有真的
// 答錯過。用 everWrong 旗標把「真的錯過」跟「只是還沒複習到第二次」分開,強制複習門檻
// 只鎖真正的錯題,不會因為玩家表現好而被無意義的待辦清單卡住進度。
const MISTAKE_MIN_GAP = 8;
// needStreak 預設 2;穿上「遺物徽章」後會傳 1(EPIC_GRADUATE_STREAK),讓錯題更快脫身
function mistakeBookOnAnswer(book, word, correct, globalQIdx, needStreak) {
  const need = needStreak || 2;
  const rec = book[word] || { streak: 0, graduated: false, lastSeenIdx: -999, everWrong: false, wrongCount: 0 };
  if (rec.wrongCount === undefined) rec.wrongCount = rec.everWrong ? 1 : 0; // 舊存檔補值
  if (correct) { rec.streak += 1; if (rec.streak >= need) rec.graduated = true; }
  else { rec.streak = 0; rec.graduated = false; rec.everWrong = true; rec.wrongCount += 1; }
  rec.lastSeenIdx = globalQIdx;
  book[word] = rec;
  return rec;
}
function mistakeIsDue(book, word, globalQIdx) {
  const rec = book[word];
  if (!rec || rec.graduated) return false;
  return (globalQIdx - rec.lastSeenIdx) >= MISTAKE_MIN_GAP;
}

// ---------- 家長學習報告(家長需求:想知道小孩單字量狀況,不是只看破關樓層)----------
// mistakeBookOnAnswer 對「每一題」(不只答錯的)都會建檔,所以 book 的 key 數就是
// 小孩實際「作答過」的字數,不是課表已教過的字數(cumulativeWords 那個是課表進度,
// 兩者故意分開回傳,避免呼叫端搞混「教過」跟「考過」)。
function learningReportStats(book, totalTaughtWords, nemesisWrongThreshold) {
  const threshold = nemesisWrongThreshold || 3;
  const words = Object.keys(book);
  let graduated = 0, everWrong = 0, dueReview = 0, nemesisCandidates = 0;
  words.forEach(w => {
    const rec = book[w];
    if (rec.graduated) graduated++;
    if (rec.everWrong) everWrong++;
    if (rec.everWrong && !rec.graduated) dueReview++;
    if (!rec.graduated && (rec.wrongCount || 0) >= threshold) nemesisCandidates++;
  });
  return {
    totalTaughtWords: totalTaughtWords || 0,
    answeredWords: words.length,
    graduatedWords: graduated,
    everWrongWords: everWrong,
    dueReviewWords: dueReview,
    nemesisCandidateWords: nemesisCandidates,
    firstTryWords: words.length - everWrong, // 從沒答錯過的字(一次就會)
  };
}
// 依 wrongCount 由高到低排序,列出目前「未畢業」的字給家長看是哪些字卡關
// (跟 dueMistakeWords() 邏輯一致,但多回傳 wrongCount/streak 供報告畫面顯示明細)
function learningReportWeakWords(book) {
  return Object.keys(book)
    .filter(w => book[w].everWrong && !book[w].graduated)
    .map(w => ({ word: w, wrongCount: book[w].wrongCount || 0, streak: book[w].streak || 0 }))
    .sort((a, b) => b.wrongCount - a.wrongCount);
}

// ---------- 例句挖空 ----------
// 實測 2000 句例句:94.7% 直接含該字可精準挖空,加上字尾變化比對(carry→carries)後
// 達 99.5%,只有 11 個字挖不出來(become/forgot/gave/said/told/won 這類不規則變化,
// 以及 communicate→communication 這種衍生詞)。挖不出來的字回傳 ok:false,
// 呼叫端要優雅退場改出普通題型,不可以直接當例外炸掉。
// ⚠️ 字尾變化命中時 inflected 會是 true——這種題目的答案選項顯示的是原形(carry),
// 但句子裡挖掉的是變化形(carries),UI 必須在答完後把完整原句秀出來,
// 否則小孩會覺得「我選了 carry 為什麼句子是 carries」。那正是要教的東西。
function escapeRegExp(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function clozeBlank(word, sentence) {
  if (!word || !sentence) return { ok: false };
  const exact = new RegExp("\\b" + escapeRegExp(word) + "\\b", "i");
  let m = exact.exec(sentence);
  let inflected = false;
  if (!m) {
    // 字尾變化:先去掉 y/e 再允許 s/es/ed/ing/d/ly/ies/er/est
    let stem = word;
    if (/y$/i.test(stem)) stem = stem.slice(0, -1);
    else if (/e$/i.test(stem)) stem = stem.slice(0, -1);
    const loose = new RegExp("\\b" + escapeRegExp(stem) + "(s|es|ed|ing|d|ly|ies|er|est)?\\b", "i");
    m = loose.exec(sentence);
    if (m) inflected = m[0].toLowerCase() !== word.toLowerCase();
  }
  if (!m) return { ok: false };
  return {
    ok: true,
    before: sentence.slice(0, m.index),
    after: sentence.slice(m.index + m[0].length),
    matched: m[0],
    inflected: inflected,
  };
}
function canCloze(w) { return !!(w && w.ex && clozeBlank(w.word, w.ex).ok); }

// 填空題的干擾選項一律取自同一個區域、同一個詞性——這樣就不能靠「只有這個是動詞」
// 之類的線索矇過去,真的要讀懂上下文。同詞性的字不夠時才放寬到整個區域。
function buildClozeChoices(target, regionWords, n) {
  const samePos = regionWords.filter(w => w.word !== target.word && w.pos === target.pos);
  const fallback = regionWords.filter(w => w.word !== target.word);
  const pool = samePos.length >= n - 1 ? samePos : fallback;
  const picked = pool.slice().sort(() => Math.random() - 0.5).slice(0, n - 1).map(w => w.word);
  return picked.concat([target.word]).sort(() => Math.random() - 0.5);
}

// ---------- 「會用」精通度(圖鑑第二層)----------
// 跟 mistakeBookOnAnswer 同一套畢業規則(連續答對 EXPEDITION_MASTER_STREAK 次),
// 但存在獨立的 usage 表裡,不污染錯題本——錯題本是「認得」那一層的資料,
// 兩層精通度要能分開看(學習報告 §33 才不會把兩件事混為一談)。
function expeditionUsageOnAnswer(usage, word, correct, needStreak) {
  const need = needStreak || EXPEDITION_MASTER_STREAK;
  const rec = usage[word] || { streak: 0, mastered: false, wrongCount: 0 };
  if (correct) { rec.streak += 1; if (rec.streak >= need) rec.mastered = true; }
  else { rec.streak = 0; rec.mastered = false; rec.wrongCount += 1; }
  usage[word] = rec;
  return rec;
}
function expeditionRegionProgress(usage, regionWords) {
  const total = regionWords.length;
  let mastered = 0;
  regionWords.forEach(w => { if (usage[w.word] && usage[w.word].mastered) mastered++; });
  return { mastered: mastered, total: total, pct: total ? Math.round(mastered / total * 100) : 0,
    cleared: total > 0 && mastered >= total };
}

// 出題優先序:還沒精通的字優先(其中曾經答錯過的排更前面),全部精通後才回頭隨機複習。
// 這樣小孩不會一直被已經會的字洗版,而區域進度也一定推得動(不會卡在抽不到新字)。
function pickExpeditionWords(regionWords, usage, n) {
  const usable = regionWords.filter(canCloze);
  const pool = usable.length >= n ? usable : regionWords; // 可挖空的字不夠才放寬
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  const weight = w => {
    const rec = usage[w.word];
    if (!rec) return 1;             // 沒碰過
    if (rec.mastered) return 3;     // 已精通,最後才輪到
    return 0;                       // 碰過但還沒精通,最優先
  };
  return shuffled.sort((a, b) => weight(a) - weight(b)).slice(0, n);
}

// pityLimit 預設 9;穿上「遺物幸運符」後會傳 EPIC_CHEST_PITY(5),保底來得更快
function rollChest(rankKey, pityCounter, luckPct, pityLimit) {
  const luckAdj = (luckPct || 0) / 100;
  let rareChance = { E: 0.12, D: 0.15, C: 0.18, B: 0.22, A: 0.26, S: 0.3, 決戰: 0.4,
    傳說: 0.45, 神話: 0.5, 終焉: 0.55 }[rankKey] + luckAdj;
  let epicChance = rareChance * 0.35;
  const forcedRare = pityCounter >= (pityLimit || 9); // 連續N次沒中稀有以上,下一次必出
  let tier = "普通";
  const roll = Math.random();
  if (forcedRare || roll < epicChance) tier = "史詩";
  else if (roll < rareChance) tier = "稀有";
  const modsBy = { 普通: [15, 30], 稀有: [40, 70], 史詩: [90, 150] };
  const [lo, hi] = modsBy[tier];
  const mods = lo + Math.floor(Math.random() * (hi - lo));
  const nextPity = tier === "普通" ? pityCounter + 1 : 0;
  return { tier, mods, nextPity };
}

const TALENT_MAX_PER_BRANCH = 15;
const TALENT_BRANCHES = [

// ---------- 選擇題干擾選項 ----------
// ⚠️ 真的bug,已修正:2000字裡有128組中文翻譯完全相同的同義字(big/large都是「大的」、
// hear/listen都是「聽」...),原本只排除「同一個英文字」,沒排除「翻譯剛好跟目標字一樣」的
// 干擾選項——小孩選big的題目,選項卻同時混進large,兩個按鈕都顯示「大的」,等於一題有兩個
// 正確答案。這裡先濾掉zh_tw跟目標重複的字,干擾選項彼此之間也不能重複(避免同一個中文字
// 被抽中兩次,看起來像重複選項),pool篩完不夠n-1個才放寬回未篩選的pool補滿。
function buildChoices(target, pool, n) {
  const others = pool.filter((w) => w.word !== target.word && w.zh_tw !== target.zh_tw);
  const shuffled = others.slice().sort(() => Math.random() - 0.5);
  const picked = [];
  const usedZh = new Set([target.zh_tw]);
  for (const w of shuffled) {
    if (picked.length >= n - 1) break;
    if (usedZh.has(w.zh_tw)) continue;
    usedZh.add(w.zh_tw);
    picked.push(w);
  }
  // 篩完(排重複中文+排重複英文)還湊不滿,才放寬回「只排除跟目標同一個英文字」的原始邏輯,
  // 避免區域字太少時題目乾脆生不出來
  if (picked.length < n - 1) {
    const relaxed = pool.filter((w) => w.word !== target.word && !usedZh.has(w.zh_tw))
      .slice().sort(() => Math.random() - 0.5);
    for (const w of relaxed) {
      if (picked.length >= n - 1) break;
      usedZh.add(w.zh_tw);
      picked.push(w);
    }
  }
  const choices = picked.map((w) => w.zh_tw).concat([target.zh_tw]);
  return choices.sort(() => Math.random() - 0.5);
}

// 剛好落在isVariantSlot()原本輪替判定的格位上(每段位內每5層一次)——用同一個格位改接新機制,

// 純粹靠「血量很厚+攻擊很強+考題是舊字」逼玩家真的複習,不是懲罰。
function isGolemFloor(floor) {

  // 在101/111/121新段位裡巧合命中(105/115/125),否則地圖圖示跟實際玩法會對不上。
  return floor <= 100 && floor > 50 && floor % 5 === 0 && floor % 10 !== 0;
}

                                 // (2026-08-01調降:1.5→1.3,呼應「戰鬥節奏太快」的反饋)
                                 // (門檻間距縮小=更早更密集地觸發反擊,數字越大觸發越密)
function variantForFloor(floor) {
  // 101層以後:考題全面改成例句填空(§34遠征地圖回收成真樓層),不再套用原本的
  // 計時/聽力/事件/復仇/魔像五種輪替——單一新變格,樓層對應的主題區域(見
  // EXPEDITION_REGIONS/regionForFloor)才是「難度差異」的來源,不需要疊加舊機制。
  if (floor > 100) return "cloze";
  if (isGolemFloor(floor)) return "golem";
  if (!isVariantSlot(floor)) return null;
  // ⚠️ 真的bug,已修正:原本用「段位內序號」算變格類型,但每個段位的樓層數(10/15/20/25/20/9)
  // 剛好都是5的倍數,導致段位內最後一個變格格位(seq最大值)永遠跟該段位的君主戰樓層重疊
  // 而被 isMonarch 跳過——結果是輪替序列排在後面的類型(event/revenge)幾乎整個100層都
  // 排不到(實測跑過100層,revenge出現0次)。改成跨段位累計的「全域序號」,不因為段位邊界

// 飼料收入隨樓層縮放:沿用 winFloor 獎勵那套 waveSizeForFloor/20 的比例思路,再疊一段
// 樓層係數。70層以上題目變多但字是舊的,收入必須跟上,否則變成「做更多工拿一樣的錢」。
function petFeedGain(floor) { return 1 + Math.floor((floor || 1) / 25); }
// 寵物傷害(電玩檢討):原本固定 (3+lv),Lv10 封頂 13,而樓層基準HP從65成長到6510——
// 寵物的相對貢獻從約8%一路衰減到約2%,玩家花450題的努力換來後期的數值雜訊。
// 這裡讓它跟著樓層縮放,寵物才會永遠是穩定的一成戰力。
// ⚠️ 寵物傷害不在 computeAttackBreakdown() 裡,所以血量安全網看不見它——這也是全遊戲
// 少數可以放心給「純數值成長」而不會被安全網吃掉的地方(其他系統都得做成改機制)。
// 但正因為看不見,寵物佔比一旦拉高,安全網就對這塊戰力盲目,所以 index.html 那邊會把
// 寵物期望傷害折算回 computeAttackBreakdown(),兩件事必須成對存在。
function petProcDmg(lv, floor) { return Math.round((3 + lv) + (floor || 1) * 0.15); }
// 追趕機制(電玩檢討):成本曲線原本對所有寵物一視同仁,第90層才馴服的新寵物同樣要從
// Lv1 餵起,那時剩餘題數根本養不起——理性玩法變成「後期馴服到的寵物永遠不餵」,
// 反過來砍掉後期追求零錯題全對的動機。新寵物起始等級跟著現有最高等寵物走。
function petStartLevel(maxOwnedLv) { return Math.max(1, Math.min(8, (maxOwnedLv || 1) - 3)); }
// 依角色等級決定可以同時帶幾隻寵物出戰(小朋友反饋:等級越高應該可以帶越多隻)
// 家長反饋「寵物也到頂了」:原本Lv14就封頂4隻,而Lv14在舊制(上限16)已經接近滿等,
// 等於整個後期寵物欄位不再成長。等級上限拉到40之後,順勢往上延伸到6隻。
function petSlotCount(charLevel) {
  if (charLevel >= 32) return 6;
  if (charLevel >= 22) return 5;
  if (charLevel >= 14) return 4;
  if (charLevel >= 10) return 3;
  if (charLevel >= 5) return 2;
  return 1;
}

// ---------- 寵物出戰抽選權重(電玩檢討的頭號問題)----------
// 原本 pickRandomActivePet() 是「均勻隨機抽一隻」,加上剛馴服的寵物會自動加入出戰隊伍,
// 兩件事撞在一起產生一個會主動懲罰玩家的反向誘因:把一隻 Lv1 新寵物加進 Lv10 老隊伍,
// 等於稀釋抽籤池,實算戰力下降約15%——而觸發它的動作正是「你剛剛達成了零錯題全對」。
// 遊戲把最高成就的獎勵包裝成 debuff,而孩子不會知道要手動去牧場把新寵物收回來。
// 改成依「等級×星級」加權抽選:強的寵物出手機率高,新寵物只吃剩餘機率,加入隊伍永遠是
// 淨正向的。同時這也讓 petSlotCount 的欄位成長第一次有了實質意義。
function petPickWeight(pet) {
  if (!pet) return 0;
  return (pet.lv || 1) * (1 + (pet.star || 0) * 0.4);
}
// roll 傳 0~1 的隨機數(測試可注入固定值),回傳被抽中的 index;pool 為 pet 物件陣列
function weightedPetIndex(pets, roll) {
  const weights = pets.map(petPickWeight);
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return -1;
  let acc = 0;
  const target = roll * total;
  for (let i = 0; i < weights.length; i++) { acc += weights[i]; if (target < acc) return i; }
  return weights.length - 1;
}

// ---------- 寵物家族屬性剋制(電玩檢討:寵物缺少「選哪隻」的決策)----------
// 16家族壓成5組 PET_SIG_GROUP,同組效果數值完全相同、只有文案不同,配合加權抽選之後
// 最佳隊伍仍然是「任意6隻高等」——SPEC §20 承諾的「選一隻主力寵物變成有意義的決定」
// 在多欄位化的時候被無聲刪掉了。龍系統早就解對了這題(DRAGON_SPECIES.affinityTag 打
// 同屬性怪 +10%),寵物直接沿用同一套:出戰寵物家族 == 本層怪物家族時給明顯加成,
// 「下一層是火系,我換火寵上場」就變成每層一次的真決策,順帶教孩子看屬性表。
const PET_AFFINITY_MULT = 1.6;
function petAffinityMult(petFid, floorFamilyId) { return petFid === floorFamilyId ? PET_AFFINITY_MULT : 1; }

// ---------- 寵物天賦(個體差異;「多元有趣」真正的來源)----------
// 收藏樂趣的來源從來不是數量,是個體差異——同樣是焰蛇,你的跟同學的不一樣。
// 馴服當下從共用池隨機抽2個掛在 S.pets[fid].traits,跟 shiny 一樣是存檔欄位。
// 成本只有一張表,卻跟屬性剋制正交,兩者相乘才有真正的隊伍組合決策。
const PET_TRAITS = [
  { id: "diligent", name: "勤學",     emoji: "📖", desc: "玩家連擊 ≥10 時,觸發機率 ×1.5" },
  { id: "glutton",  name: "貪吃",     emoji: "🍖", desc: "戰鬥中獲得的寵物飼料 +30%" },
  { id: "brave",    name: "勇者",     emoji: "🛡️", desc: "君主層／十層之王的觸發機率 +50%" },
  { id: "lucky",    name: "幸運",     emoji: "🍀", desc: "試煉寶物掉落稀有度提升" },
  { id: "guardian", name: "護主",     emoji: "❤️", desc: "玩家命數 ≤2 時,寵物傷害 ×2" },
  { id: "precocious", name: "早熟",   emoji: "🌱", desc: "升級所需飼料 −25%" },
  { id: "latebloom", name: "大器晚成", emoji: "🌙", desc: "Lv8 前效果 −20%,Lv10 後 +40%" },
  { id: "nocturnal", name: "夜行",   emoji: "🌃", desc: "每日修行連續 ≥3 天時,觸發機率加倍" },
];
const PET_TRAIT_COUNT = 2;
function randomPetTraits(rng) {
  const r = rng || Math.random;
  const pool = PET_TRAITS.map(t => t.id);
  const out = [];
  for (let i = 0; i < PET_TRAIT_COUNT && pool.length; i++) out.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  return out;
}
function petHasTrait(pet, id) { return !!(pet && pet.traits && pet.traits.indexOf(id) >= 0); }
// 「大器晚成」是唯一有取捨的天賦(有取捨的天賦才好玩),效果倍率獨立成一個函式
function petTraitPowerMult(pet) {
  if (!petHasTrait(pet, "latebloom")) return 1;
  return (pet.lv || 1) >= 10 ? 1.4 : ((pet.lv || 1) < 8 ? 0.8 : 1);
}
function petFeedCostFor(pet) {
  const base = petFeedCost(pet.lv);
  return petHasTrait(pet, "precocious") ? Math.max(1, Math.round(base * 0.75)) : base;
}

// ---------- 寵物突破:★0→★5 覺醒階(第二軸,材料是「馴服印記」不是飼料)----------
// 突破的材料刻意不用飼料:已經擁有該家族的寵物時,再次在同家族樓層達成零錯題全對
// (或清空該家族錯題)得到 1 枚該家族的馴服印記。這一刀同時解掉三件事——
//   (a) 寵物收藏其實只有16隻上限(S.pets 用家族id當key),第17層之後每次完美作答的
//       獎勵都是 nil,「答得又快又準」這條核心動機在遊戲進行到兩成時就熄火;
//   (b) 後期馴服到的寵物一出生就是死棋(見 petStartLevel);
//   (c) 孩子會為了強化火系而主動去挑火系樓層拚全對——目標感是玩家自己選的。
const PET_STAR_MAX = 5;
const PET_STAR_COST = [1, 2, 3, 5, 8]; // 突破到 ★1..★5 各需幾枚印記
function petStarCost(curStar) { return curStar >= PET_STAR_MAX ? null : PET_STAR_COST[curStar]; }
function petStarMult(star) { return Math.pow(1.15, star || 0); }          // ★5 = ×2.0(乘算,不是加算)
function petStarChanceBonus(star) { return (star || 0) * 0.02; }
function petStarSigBoost(star) { return (star || 0) >= 3 ? 1 : 0; }        // ★3 絕招強化一檔
function petStarName(name, star) {
  if ((star || 0) >= PET_STAR_MAX) return name + "・究極型";
  return (star || 0) > 0 ? name + "・覺醒" + ["", "Ⅰ", "Ⅱ", "Ⅲ", "Ⅳ"][star] : name;
}
// ★2 給一次洗天賦機會:避免「抽到廢天賦卻是這個家族唯一一隻」的絕望感
const PET_RETRAIT_STAR = 2;
// 專精轉換:Lv10 後可用飼料在5組 PET_SIG_GROUP 之間切換。16家族壓成5組原本是重複感的
// 來源,開放自由配之後翻轉成優點(可組出「4隻保命+2隻輸出」的隊伍),同時給封頂後
// 只進不出、必然變成死貨幣的 🍖 一個永久去化口。
const PET_SIG_GROUP_LIST = ["counterImmune", "doubleProc", "lifeRecover", "dot", "procBoost"];
const PET_RESPEC_SIG_COST = 120;
function petSigGroupOf(fid, pet) { return (pet && pet.sigOverride) || PET_SIG_GROUP[fid]; }

// ---------- 寵物出手的單一權威計算(戰鬥端與血量安全網共用同一份數學)----------
// ctx: { fid, pet, floorFamilyId, floor, streak, lives, isBossFloor, dailyStreak }
// 回傳 { chance, dmg, sigGroup, sigPower } —— 戰鬥端拿去擲骰,安全網拿 chance×dmg 當期望值。
// 兩邊共用同一個函式,才不會出現「數值改了一邊、安全網還在用舊公式」的靜默偏差。
function petStrike(ctx) {
  const pet = ctx.pet || {};
  const lv = pet.lv || 1;
  const star = pet.star || 0;
  const sigPower = petSigPower(lv);
  const sigGroup = sigPower > 0 ? petSigGroupOf(ctx.fid, pet) : null;

  let chance = (petAutoChance(lv) + petStarChanceBonus(star)) * (pet.shiny ? 1.3 : 1);
  if (sigGroup === "procBoost") chance *= 1 + 0.5 * sigPower;
  if (petHasTrait(pet, "diligent") && (ctx.streak || 0) >= 10) chance *= 1.5;
  if (petHasTrait(pet, "brave") && ctx.isBossFloor) chance *= 1.5;
  if (petHasTrait(pet, "nocturnal") && (ctx.dailyStreak || 0) >= 3) chance *= 2;
  chance = Math.min(0.95, chance);

  let dmg = petProcDmg(lv, ctx.floor) * petStarMult(star) * petTraitPowerMult(pet);
  dmg *= petAffinityMult(ctx.fid, ctx.floorFamilyId);
  if (pet.shiny) dmg *= 1.5;
  if (petHasTrait(pet, "guardian") && (ctx.lives != null && ctx.lives <= 2)) dmg *= 2;
  if (sigGroup === "dot") dmg += 2 * sigPower * (1 + petStarSigBoost(star) * 0.5);

  return { chance, dmg: Math.max(1, Math.round(dmg)), sigGroup, sigPower, star };
}
// 絕招各自的觸發機率(★3 之後強化一檔),同樣兩邊共用
function petDoubleProcChance(sigPower, star) { return sigPower * (petStarSigBoost(star) ? 0.35 : 0.2); }
function petLifeRecoverChance(sigPower, star) { return sigPower * (petStarSigBoost(star) ? 0.25 : 0.15); }

function dailyStreakBonus(streak) { return Math.min(10 + streak * 5, 100); }

// 電玩檢討(2026-08):原本固定 3+stage×2,stage9期望傷害只有4.5,對照第100層君主HP 6510
// 只佔0.07%——這是我上一輪修過的寵物同一種病(加法對抗乘法),龍還停在舊公式。
// 補上樓層縮放,做法跟 petProcDmg() 一致才不會兩邊各自維護一份數學。
function dragonProcDmg(stage, floor) { return Math.round((3 + stage * 2) + (floor || 1) * 0.15); }
// 小朋友反饋:龍蛋要能主動照顧,不是只有被動等樓層數字——用改裝點餵養,慢慢養出羈絆加成
// 電玩檢討:羈絆滿10點花600🔧只換5%傷害,對照武器Lv1→8花805🔧換92%——理性玩家永遠
// 不會餵。而且這違反SPEC §20自己寫下的原則(改裝點不該身兼多職互搶),龍餵養跟武器
// 升級搶同一份錢包還輸得極慘。改成用寵物飼料🍖(跟寵物一樣是「照顧夥伴」的貨幣,
// 而不是跟武器/裝備商業行為搶同一份 mods),回報同步拉高到 +2%/點。
function dragonFeedCost(bond) { return 15 + bond * 10; }
function dragonBondBonus(bond) { return (bond || 0) * 0.02; } // 每點羈絆+2%傷害,滿10點+20%

// ---------- 龍息槽:主動技能(電玩檢討「龍升級要有趣的機制」)----------
// 龍原本跟寵物共用同一套 PET_SIG_GROUP 5組機制(dot/doubleProc/lifeRecover/procBoost/
// counterImmune),孩子戰鬥時看到的是兩隻各自擲骰、各自飄字的東西,差別只有emoji不同。
// 寵物是「被動、複數、機率」,龍息槽讓龍變成「主動、唯一、確定」——這是龍相對寵物
// 唯一乾淨的差異化,不是再加一條數值線。戰鬥中每答對一題累積,滿槽時玩家自己按鈕
// 觸發,不是小機率觸發。四種效果各自獨立於 PET_SIG_GROUP,不跟寵物絕招重複。
const DRAGON_BREATH_MAX = 100;
// 連擊越高累積越快(呼應連擊系統),但有上限避免無腦刷到失控
function dragonBreathGain(streak) { return 10 + Math.min(streak || 0, 10); }
const DRAGON_BREATH_DMG_MULT = 3; // 施放後下一次攻擊傷害 ×3,確定觸發,不是機率
const DRAGON_BREATH_EFFECTS = {

// 灼焰吐息的燒傷傷害:刻意跟樓層基準HP掛鉤(不是寫死常數),晚期樓層才不會變成數值雜訊——
// 跟 petProcDmg() 的樓層縮放同一個教訓

// 小朋友反饋:孵化時骰一個小小的血脈天賦,讓兩隻龍就算長到同一階段,數值也不完全一樣

// ---------- 史詩遭遇:黑巫師/黑暗龍(家長需求 §5)----------
// 家長要的是「隨機出現在關卡讓小朋友驚喜」,不是固定樓層的特殊關卡入口——所以整組沿用
// 既有的異色怪隨機遭遇管線(startIntro 裡先 roll 好、intro 跟戰鬥畫面共用同一個結果),
// 不新增樓層類型、不動 variantForFloor 的輪替序(那個已經因為段位邊界修過一次 bug,
// 再插新類型會連帶改變 70 層以下的變格分布)。
//
// 機制核心:史詩怪身上有一層「封印護盾」,一般答題傷害全部被彈開,只有答對「破解題」
// (從玩家自己曾經答錯過的字裡抽)才能剝掉一層。護盾破完才轉成一般 boss 戰。
// 節奏刻意做成「解謎 → 宣洩」:先逼真的複習,再讓他痛快輸出。
const EPIC_MIN_FLOOR = 70;
const EPIC_BASE_CHANCE = 0.14;
const EPIC_PITY_FLOORS = 8; // 連續8層沒遇到必定出現——小孩最怕「哥哥有我沒有」
const EPIC_SEAL_MIN = 3, EPIC_SEAL_MAX = 5;
const EPIC_HP_MULT = 1.4; // 刻意不用魔像怪的2.0:護盾階段已經吃掉一段時間,再厚會變成兩倍疲勞
const EPIC_MONSTERS = [
  { id: "darkwizard", name: "黑巫師", emoji: "🧙‍♂️", taunt: "『你背過的字,我全都記得——包括你答錯的那些。』" },

function epicOwnedCount(epicGear) { return EPIC_PIECES.filter(p => (epicGear || {})[p.slot]).length; }

function nextEpicPiece(epicGear) { return EPIC_PIECES.find(p => !epicHas(epicGear, p.slot)) || null; }

// ---------- 殘卷(史詩怪掉落,可讓一個未畢業錯題字直接畢業)----------
// 讓錯題本從「債」變成「可消費的戰利品」——小孩會為了拿殘卷去找史詩怪,為了用殘卷去看錯題本。
function scrollDropCount() { return 1 + Math.floor(Math.random() * 2); }

// ---------- 懸賞令(把「我的弱點」重新框成「我的獵物」)----------
// 目前錯題複習只有被硬門檻擋下才會去,是**強制**不是**想玩**。懸賞令的目的是讓小孩

const BOUNTY_SLOTS = 3;
function bountyReward(wrongCount) {

// ---------- 宿敵系統(把抽象的錯題人格化)----------
// 某個字錯滿3次 → 「附身」到一隻怪身上成為專屬宿敵,之後陰魂不散地出現嘲諷,
// 直到你連續兩次答對牠才淨化。兩個國中男生對「我有個死對頭」的接受度,
// 遠高於「你有7個字沒背熟」。視覺完全複用既有的16家族/圖鑑管線,不需要新素材。
const NEMESIS_WRONG_THRESHOLD = 3;
const NEMESIS_PURIFY_STREAK = 2;   // 連續答對2次才淨化(答錯歸零重來)
const NEMESIS_APPEAR_CHANCE = 0.5; // 有宿敵時每層的現身機率
const NEMESIS_TAUNTS = [

function nemesisTaunt(seed) { return NEMESIS_TAUNTS[Math.abs(seed || 0) % NEMESIS_TAUNTS.length]; }

// ---------- 樓層怪物的程序生成 SVG(不引入任何外部素材)----------
// 100層目前全部是 emoji,覆蓋率提升最有感的一步。用「屬性家族主色 + 幾何輪廓模板 +
// 樓層當種子」生成,每層都不一樣且**每次進同一層都長一樣**(種子固定,不是每次隨機)。
// 為什麼不加 PNG:這個 App 的素材採用門檻是「只收 CC0」,而自己畫的 SVG 著作權歸自己、
// 零授權風險;而且 inline SVG 隨 index.html 一起被 service worker 快取,
// 不必每加一張圖就去維護 SW 快取清單(那是這個 App 家族的已知踩雷點)。
const FAMILY_COLORS = {
  elec: ["#ffe66d", "#f7b731"], flame: ["#ff7b54", "#d63031"], shadow: ["#8e7cc3", "#4a3f6b"],
  mech: ["#b2bec3", "#636e72"], venom: ["#a29bfe", "#6c5ce7"], frost: ["#81ecec", "#0984e3"],
  wind: ["#c8f7dc", "#00b894"], stone: ["#d1ccc0", "#84817a"], water: ["#74b9ff", "#0652DD"],
  light: ["#ffeaa7", "#fdcb6e"], phantom: ["#dfe6e9", "#b2bec3"], beast: ["#e17055", "#8b4513"],
  bug: ["#badc58", "#6ab04c"], bone: ["#f5f6fa", "#a4b0be"], vine: ["#7bed9f", "#2ed573"],
  rust: ["#e58e26", "#b33939"],
};
// 用樓層當種子的小型 PRNG(不是 Math.random——同一層每次進來必須長得一樣)
function monsterSeedRand(seed) {
  let x = (seed * 2654435761) % 2147483647;
  return function () { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; };
}
// 回傳一段 inline SVG 字串。shiny/epic 只改配色與光暈,不另外生一套形狀。
function monsterSvg(floor, famId, opts) {
  opts = opts || {};
  const [c1, c2] = FAMILY_COLORS[famId] || ["#a4b0be", "#57606f"];
  const rnd = monsterSeedRand(floor * 97 + 13);
  const body = Math.floor(rnd() * 4);          // 4種輪廓模板
  const eyes = 1 + Math.floor(rnd() * 3);      // 1~3隻眼睛
  const spikes = 3 + Math.floor(rnd() * 6);    // 背刺數量
  const wob = 0.8 + rnd() * 0.4;               // 體型胖瘦
  const id = "mg" + floor;
  const shapes = [
    `<circle cx="50" cy="52" r="${28 * wob}"/>`,                                   // 圓球型
    `<path d="M50 18 L${50 + 30 * wob} 76 L${50 - 30 * wob} 76 Z"/>`,               // 尖角型
    `<rect x="${50 - 27 * wob}" y="26" width="${54 * wob}" height="52" rx="10"/>`,  // 方塊型
    `<ellipse cx="50" cy="52" rx="${30 * wob}" ry="24"/>`,                          // 飄浮型
  ];
  let spikeHtml = "";
  for (let i = 0; i < spikes; i++) {
    const a = (Math.PI * 2 * i) / spikes;
    const x = 50 + Math.cos(a) * 30 * wob, y = 52 + Math.sin(a) * 26;
    spikeHtml += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(3 + rnd() * 3).toFixed(1)}" opacity=".85"/>`;
  }
  let eyeHtml = "";
  const eyeGap = 16;
  for (let i = 0; i < eyes; i++) {
    const x = 50 + (i - (eyes - 1) / 2) * eyeGap;
    eyeHtml += `<circle cx="${x.toFixed(1)}" cy="46" r="5.5" fill="#12151c"/>
      <circle cx="${(x + 1.6).toFixed(1)}" cy="44.4" r="1.9" fill="#fff"/>`;
  }
  const glow = opts.shiny || opts.epic
    ? `<filter id="${id}f"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`
    : "";
  const outer = opts.epic ? "#1b1024" : c2;
  return `<svg class="monsterSvg" viewBox="0 0 100 100" role="img" aria-label="第${floor}層守衛">
    <defs>${glow}<radialGradient id="${id}g" cx="40%" cy="34%">
      <stop offset="0%" stop-color="${opts.epic ? "#b388ff" : c1}"/><stop offset="100%" stop-color="${outer}"/>
    </radialGradient></defs>
    <g fill="url(#${id}g)" ${glow ? `filter="url(#${id}f)"` : ""}>${spikeHtml}${shapes[body]}</g>
    ${eyeHtml}</svg>`;
}

// ⚠️ words.js 原始 unit 欄位是1-40(每單元50字),不是規劃假設的1-100(每單元20字)。
// 樓層改用「依陣列順序每20字切一段」當樓層批次(2000字÷20=100層剛好整除)。
function floorWords(floorIdx){ const start=(floorIdx-1)*20; return WORDS.slice(start, start+20); }
function cumulativeWords(uptoFloor){ return WORDS.slice(0, uptoFloor*20); }
// 主線100層固定教2000字(第1~2000筆)。words.js尾端後來追加的「秘寶詞卷」補充字彙
// (topic:"bonus")不算在主線課表裡,顯示教過字數/總字數時要用這個常數,不能直接用
// WORDS.length,否則學習報告(給家長看)的分母會被沒教過的字灌水。
const MAIN_STORY_WORD_COUNT = 2000;
function isBonusVaultWord(w){ return w.topic==="bonus"; }
function bonusVaultWords(){ return WORDS.filter(isBonusVaultWord); }

// ===== 戰鬥視覺/音效(參考902_english2000三角洲模式手法,純CSS+Web Audio,無外部資源) =====
let __actx = null;
// 音效設計會議建議:雙層命中音(高頻脆聲+低頻悶擊)、依血量%動態調整音高/音量、
// 連擊做do-re-mi-fa-so音階、反擊警報改成加速心跳感、寵物專屬音色不再借用防禦音
function towerSfx(kind, opts){
  opts = opts || {};
  try{
    if (!__actx) __actx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = __actx, now = ctx.currentTime;
    const urgency = opts.bossPct!==undefined ? Math.max(0, 1-opts.bossPct) : 0; // 0=剛出場,1=快死了
    function noiseHit(gainPeak, dur, lpFreq){
      const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const lp = ctx.createBiquadFilter(); lp.type="lowpass";
      lp.frequency.setValueAtTime(lpFreq||4000, now); lp.frequency.exponentialRampToValueAtTime(600, now+dur);
      const g = ctx.createGain(); g.gain.setValueAtTime(gainPeak, now); g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start(now); src.stop(now+dur);
    }
    function tone(freqFrom, freqTo, dur, type, gainPeak, filterType){
      const osc = ctx.createOscillator(); osc.type = type||"sine";
      osc.frequency.setValueAtTime(freqFrom, now);
      if (freqTo!==undefined) osc.frequency.exponentialRampToValueAtTime(Math.max(1,freqTo), now+dur);
      const g = ctx.createGain(); g.gain.setValueAtTime(gainPeak, now); g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      let outNode = osc;
      if (filterType){ const f=ctx.createBiquadFilter(); f.type=filterType; f.frequency.value=freqFrom; osc.connect(f); outNode=f; }
      outNode.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now+dur);
    }
    if (kind==="hit") {
      noiseHit(0.18+urgency*0.08, 0.06, 4000); // 高頻脆聲(瞬態)
      tone(80-urgency*20, 40, 0.08, "square", 0.13+urgency*0.05); // 低頻悶擊,血越少越急促沉重
    }
    else if (kind==="crit") { noiseHit(0.3, 0.08, 5000); tone(1200, 2400, 0.12, "sawtooth", 0.07, "highpass"); }
    else if (kind==="streak") {
      const scale=[523,587,659,698,784]; // do-re-mi-fa-so,每5連擊往上爬一階
      const idx = Math.max(0, Math.min(Math.floor((opts.streak||0)/5)-1, scale.length-1));
      tone(scale[idx], undefined, 0.09, "triangle", 0.06);
    }
    else if (kind==="counter") // 越來越急促的警報感(間隔180→120→80ms)
      [[0],[180],[300],[380]].forEach(([delay])=>setTimeout(()=>tone(440,220,0.14,"sawtooth",0.15), delay));
    else if (kind==="defend") tone(440,880,0.15,"sine",0.12);
    else if (kind==="miss") tone(200,80,0.22,"square",0.08);
    else if (kind==="pet") { tone(800,1200,0.08,"sine",0.05); setTimeout(()=>tone(1200,800,0.08,"sine",0.05),90); }
    else if (kind==="dingSync") tone(2000,undefined,0.03,"sine",0.04);
    else if (kind==="victory") { [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,undefined,0.18,"sine",0.1),i*150)); }
    else if (kind==="defeat") tone(300,60,0.4,"square",0.12);
  }catch(e){ /* Web Audio 不可用時安靜失敗,不影響遊戲進行 */ }
}

// ===== 背景音樂(小朋友反饋:先前純Web Audio單音旋律太難聽,2026-08-07改用真的音樂檔)=====
// 素材來源:Kevin MacLeod (incompetech.com), CC-BY 4.0(見 assets/CREDITS.txt),
// 已裁成45秒可循環片段+首尾各1-3秒淡入淡出、降到96kbps壓小檔案(assets/bgm/*.mp3)。
// 用<audio loop>取代原本的setInterval排程——不用擔心regression.js沙盒卡死問題,
// <audio>元素在Node測試環境本來就是no-op(document.createElement在jsdom-less沙盒也安全)。
let __bgmMuted = (function(){ try{ return localStorage.getItem("tower_bgm_muted")==="1"; }catch(e){ return false; } })();
let __bgmCurrentMood = null;
let __bgmEl = null;
const BGM_FILES = {
  calm:    "assets/bgm/calm.mp3",
  explore: "assets/bgm/explore.mp3",
  battle:  "assets/bgm/battle.mp3",
};
function stopBgm(){
  if (__bgmEl){ try{ __bgmEl.pause(); }catch(e){} }
}
function startBgm(mood){
  __bgmCurrentMood = mood;
  if (!__bgmEl && typeof Audio!=="undefined"){
    __bgmEl = new Audio(); __bgmEl.loop = true; __bgmEl.volume = 0.35;
  }
  if (!__bgmEl) return;
  if (__bgmMuted || !mood){ stopBgm(); return; }
  const src = BGM_FILES[mood];
  if (!src) { stopBgm(); return; }
  if (!__bgmEl.src || !__bgmEl.src.endsWith(src)) __bgmEl.src = src;
  __bgmEl.play().catch(()=>{ /* 瀏覽器自動播放限制,等下一次使用者互動觸發的render()再試 */ });
}
// 依目前畫面決定音樂情境:戰鬥(boss)用battle、小怪波用explore、其他畫面(首頁/商店等)用calm,
// 登入/選職業畫面保持安靜(還沒真的進入遊戲節奏)
function bgmMoodForCurrentState(){
  if (view==="login" || view==="classPick") return null;
  if (view==="quiz" && quizState) {
    if (quizState.phase==="boss") return "battle";
    if (quizState.phase==="wave") return "explore";
  }
  if (view==="counter") return "battle";
  return "calm";
}
function toggleBgmMute(){
  __bgmMuted = !__bgmMuted;
  try{ localStorage.setItem("tower_bgm_muted", __bgmMuted?"1":"0"); }catch(e){}
  if (__bgmMuted) stopBgm(); else startBgm(__bgmCurrentMood||bgmMoodForCurrentState());
  render();
}
// hit-stop:命中瞬間讓全站CSS動畫暫停一瞬間,是三位影音專家一致認為性價比最高的打擊感手法
function hitStop(ms){
  try{
    document.body.classList.add("hitstop");
    setTimeout(()=>document.body.classList.remove("hitstop"), ms||70);
  }catch(e){}
}
function damageNumber(dmg, isCrit){
  const el = document.createElement("div");
  el.className = "dmgNum" + (isCrit?" crit":"");
  el.textContent = (isCrit?"💥":"") + dmg;
  document.body.appendChild(el);
  towerSfx("dingSync");
  setTimeout(()=>el.remove(), 700);
}
function triggerBossMiss(){
  const el = document.getElementById("bossEmoji");
  if (!el) return;
  el.classList.remove("shake","flash","critpunch","missed"); void el.offsetWidth;
  el.classList.add("missed");
}
function flashScreen(kind){
  const el = document.getElementById("screenflash");
  if (!el) return;
  el.classList.remove("good","bad"); void el.offsetWidth; // 強制 reflow 才能重觸發動畫
  el.classList.add(kind);
}
function triggerBossHit(crit){
  const el = document.getElementById("bossEmoji");
  if (!el) return;
  el.classList.remove("shake","flash","critpunch","missed"); void el.offsetWidth;
  el.classList.add(crit?"critpunch":"shake");
  if (crit) el.classList.add("flash");
}
function triggerAnticipate(){
  const el = document.getElementById("bossEmoji");
  if (!el) return;
  el.classList.remove("anticipate"); void el.offsetWidth;
  el.classList.add("anticipate");
}
const CLASS_FX_HTML = {
  assassin: `<div class="fx-assassin"></div>`,
  sniper: `<div class="fx-sniper"></div>`,
  guardian: `<div class="fx-guardian"></div>`,
  elementalist: [0,1,2,3,4].map(i=>{
    const ang = i*72*Math.PI/180, tx=Math.cos(ang)*50+"px", ty=Math.sin(ang)*50+"px";
    return `<div class="fx-elem" style="--tx:${tx};--ty:${ty}">${["⚡","🔥","❄️","✨","💠"][i]}</div>`;
  }).join(""),
};
function triggerClassFx(cls){
  const layer = document.getElementById("fxLayer");
  if (!layer) return;
  layer.innerHTML = CLASS_FX_HTML[cls]||"";
  setTimeout(()=>{ if(layer) layer.innerHTML=""; }, 500);
}
function floatText(text){
  const el = document.createElement("div");
  el.className = "floatText"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
// 參考Cryptmaster(單字本身就是攻擊指令的地下城遊戲):答對的單字用喊招式的方式呈現,
// 讓「學單字」跟「打架」感覺是同一件事,而不是「先過一道單字關卡,才觸發預錄好的攻擊動畫」
function battleCry(word){
  const el = document.createElement("div");
  el.className = "battleCry"; el.textContent = `「${word.toUpperCase()}」!`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 900);
}
function triggerPetLunge(fid){
  const el = document.getElementById(fid ? "petBattle_"+fid : "");
  if (!el) return;
  el.classList.remove("lunge"); void el.offsetWidth;
  el.classList.add("lunge");
}
function starsFor(lv){ return "★".repeat(Math.ceil(lv/2)) + "☆".repeat(5-Math.ceil(lv/2)); }
// 出戰寵物可能不只一隻,每次觸發只挑一隻擲機率,避免多寵物效果疊加。
// ⚠️ 原本是「均勻隨機」,那會讓剛馴服的 Lv1 新寵物稀釋整個抽籤池——而新寵物是自動加入
// 出戰隊伍的,等於「達成零錯題全對」這個最高成就會自動讓玩家戰力下降約15%,而且孩子
// 不會知道要手動去牧場把牠收回來。改成依 petPickWeight(等級×星級)加權抽選之後,
// 加入隊伍永遠是淨正向的,petSlotCount 的欄位成長也第一次有了實質意義。
function pickRandomActivePet(){
  const pool = S.activePetIds.filter(fid=>S.pets[fid]);
  if (!pool.length) return null;
  const idx = weightedPetIndex(pool.map(fid=>S.pets[fid]), Math.random());
  return idx < 0 ? null : pool[idx];
}
// 把戰鬥當下的情境打包給 engine.js 的 petStrike()——戰鬥端與血量安全網共用同一份數學,
// 才不會出現「數值改了一邊、安全網還在用舊公式」的靜默偏差
function petStrikeCtx(fid, floor, streak){
  return {
    fid, pet: S.pets[fid], floor,
    floorFamilyId: familyForFloor(floor).id,
    streak: streak || 0,
    lives: S.livesCur,
    isBossFloor: isMonarch(floor) || isDecadeKing(floor),
    dailyStreak: S.dailyStreak || 0,
  };
}
// 「貪吃」天賦:戰鬥中獲得的飼料 +30%(隊伍裡有任何一隻貪吃就生效,不疊加)
function petFeedGainNow(){
  const base = petFeedGain(S.floor);
  const glutton = S.activePetIds.some(fid=>petHasTrait(S.pets[fid],"glutton"));
  return glutton ? Math.max(base+1, Math.round(base*1.3)) : base;
}
// 「幸運」天賦:出戰隊伍裡有幸運寵物時,試煉寶物掉落稀有度提升
function petLuckBonusPct(){
  return S.activePetIds.some(fid=>petHasTrait(S.pets[fid],"lucky")) ? 5 : 0;
}
// ---------- 龍息槽(電玩檢討「龍升級要有趣的機制」)----------
// 只有孵化過(stage>=1)才會充能——蛋還沒孵不該有主動技能。gauge 存在 quizState 裡
// 而不是 S,因為它是「這一層」的資源,不需要跨存檔持久化,每層開始(startWave)歸零。
function gainDragonBreath(qs){
  if (S.dragonStage < 1) return;
  qs.dragonBreathGauge = Math.min(DRAGON_BREATH_MAX, (qs.dragonBreathGauge||0) + dragonBreathGain(qs.streak));
}
function dragonBreathReady(qs){ return S.dragonStage>=1 && (qs.dragonBreathGauge||0) >= DRAGON_BREATH_MAX; }
// 施放:消耗滿槽,對下一次攻擊做確定 ×3(不是機率——龍息槽整組機制的核心差異就是
// 「玩家自己決定什麼時候用」,不是被動小機率),並套用血統對應的四選一效果。
// 暗影(doubleStrike)是唯一「立即生效」的效果——直接扣 boss 血量,不等下一次攻擊。
function useDragonBreath(){
  const qs = quizState;
  if (qs.phase!=="boss" || !dragonBreathReady(qs)) return;
  qs.dragonBreathGauge = 0;
  S.__dragonBreathCharged = true;
  const eff = dragonBreathEffectFor(S.dragonSpecies);
  window.__dragonBreathMsg = eff.label;
  if (eff.key==="burn") qs.dragonBurnLeft = eff.hits;
  if (eff.key==="counterImmune") qs.dragonBreathCounterImmuneLeft = eff.count;
  if (eff.key==="critNext") qs.dragonCritNext = true;
  if (eff.key==="doubleStrike") {
    // 立即再攻擊一次:用當下攻擊力總覽(不含連擊變動)當一次穩定命中,不用等下一題
    const dmg = Math.max(1, computeAttackBreakdown().finalDmg);
    qs.bossHp = Math.max(0, qs.bossHp - dmg);
    window.__dragonBreathInstant = dmg;
  }
  towerSfx("pet");
  floatText(`🐲${eff.label}`);
  render();
}
// 龍蛋血脈天賦加成(小朋友反饋:精進龍蛋機制,孵化時骰的小天賦,跟成長階段的加成分開算)
function dragonTraitLuckBonus(){ return S.dragonTrait==="luck3" ? 3 : 0; }
function dragonTraitExpBonusPct(){ return S.dragonTrait==="exp5" ? 5 : 0; }
function dragonTraitDmgBonus(){ return S.dragonTrait==="dmg3" ? 0.03 : 0; }
function totalLuckPct(){ return gearLuckPct(S.gear)+statLuckPctBonus(effectiveStats())+dragonTraitLuckBonus()+petLuckBonusPct(); }
// 天賦樹「生存」分支的命數上限加成——跟vit屬性點/護甲裝備/特別彩蛋同一個加法區,
// 4個地方(ensureRankLives/refillLives/recomputeLivesMax)都要套用同一個數字,集中成一個函式
function talentSurvivalBonusForClass(cls){ return talentSurvivalBonus((S.talents[cls]||{}).survival||0); }
// 用瀏覽器內建 Web Speech API 唸出單字發音,不需要外部音檔/API key
function speakWord(word){
  try{
    if (!window.speechSynthesis || !word) return;
    window.speechSynthesis.cancel(); // 避免上一個字還沒唸完就疊音
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){ /* 瀏覽器不支援時安靜失敗,不影響作答 */ }
}

// ---------- 每日遊玩時間上限(家長需求:每天最多90分鐘,時間到整個鎖死只能看不能玩)----------
// 固定寫死分鐘數(不做家長設定畫面,先求簡單能用,以後要改數字/加PIN畫面再說)。
// 用setInterval每30秒累加一次(不是即時讀系統時鐘算差值),簡單、跟每日修行的
// toDateString()同一套換日判斷方式一致,累積的分鐘數就直接存在S裡跟著存檔走。
const DAILY_TIME_LIMIT_MINUTES = 90;
let __playTimeHandle = null;
function ensurePlayTimeToday(){
  const today = new Date().toDateString();
  if (S.playDate !== today) { S.playDate = today; S.playMinutesToday = 0; }
}
function isDailyTimeLimitReached(){
  ensurePlayTimeToday();
  return S.playMinutesToday >= DAILY_TIME_LIMIT_MINUTES;
}
// 只鎖「開始新的一輪玩法」(小怪波/boss/試煉/回聲/每日修行/錯題複習),不會強制打斷正在
// 進行中的戰鬥——時間到的當下如果剛好在打boss,讓這一場先打完,下一次要開新的才會被擋。
function startPlayTimeHeartbeat(){
  if (__playTimeHandle) return;
  ensurePlayTimeToday();
  __playTimeHandle = setInterval(()=>{
    if (!S) return;
    ensurePlayTimeToday();
    S.playMinutesToday += 0.5;
    saveGame();
    if (view==="home") render(); // 如果剛好在首頁,即時反映鎖定狀態,不用等下次操作才更新
  }, 30000);
}

// 存檔欄位遷移:任何時候疊加新系統,舊存檔都可能缺欄位。用 newSave() 的預設值
// 補齊所有缺漏的頂層欄位,不管是登入讀檔還是用「存檔備份」畫面匯入舊字串都要走這裡,
// 否則舊存檔一讀就會因為 undefined 取值讓整支 App 白屏當機。
function hydrateSave(save){
  const def = newSave();
  Object.keys(def).forEach(k=>{
    if (save[k]===undefined) save[k]=def[k];
  });
  // 電玩檢討(2026-08):精通原本綁在單一武器id(save.weaponKill[wid])上,換武器就歸零。
  // 改成綁在職業上(save.classHits[cls])。舊存檔的 weaponKill 是「答對次數」不是真的
  // 擊殺數,武器id前綴(如"assassin_3")就是職業id,靠這個把舊資料按職業加總搬過去,
  // 玩家原本累積的精通不會憑空消失。搬完就不再需要 weaponKill 這個容易誤導的舊欄位名
  // (它記的其實是答對次數,叫kill會讓人誤以為滿精通要320隻怪,實際是320次答對)。
  if (save.weaponKill && typeof save.weaponKill === "object") {
    Object.keys(save.weaponKill).forEach(wid=>{
      const cls = wid.split("_")[0];
      if (!CLASS_META[cls]) return;
      save.classHits[cls] = (save.classHits[cls]||0) + (save.weaponKill[wid]||0);
    });
    delete save.weaponKill;
  }
  // 電玩檢討:覺醒/極型半價機制(evolveCostForClass)上線——同職業裡曾經覺醒過同一階
  // 的玩家,理應立刻拿到折扣,不是要他們「假裝從沒覺醒過」重新算起。classEvolvedMax
  // 是全新欄位,泛用遷移只會補空物件,這裡另外按武器id前綴把既有 evolved 資料回填。
  if (save.evolved && typeof save.evolved === "object") {
    Object.keys(save.evolved).forEach(wid=>{
      const cls = wid.split("_")[0];
      if (!CLASS_META[cls]) return;
      const stage = evolveStage(save.evolved[wid]);
      if (stage > (save.classEvolvedMax[cls]||0)) save.classEvolvedMax[cls] = stage;
    });
  }
  // gear 是巢狀物件,新增裝備槽位時舊存檔的 save.gear 已經存在(不是undefined),
  // 上面那層淺層檢查補不到,要另外把新槽位的預設值補進去
  GEAR_SLOTS.forEach(slot=>{ if (save.gear[slot]===undefined) save.gear[slot]=1; });
  // trialItems 同理是巢狀物件,合成系統新增的 iridescent_shard 欄位對「已經玩過試煉之塔」
  // 的存檔來說,save.trialItems 已經存在(不是undefined),要另外補新物品的預設值0
  if (save.trialItems && save.trialItems.iridescent_shard===undefined) save.trialItems.iridescent_shard = 0;
  // talents 也是巢狀物件(每個職業各自一組分支點數),雖然這是全新欄位理論上會被上面的
  // 泛用檢查整包補上,但職業以後如果再增加,這裡才補得到新職業的分支——先寫好防呆
  Object.keys(CLASS_META).forEach(cls=>{
    if (!save.talents[cls]) save.talents[cls] = {burst:0,survival:0,combo:0};
  });
  // expedition 同樣是巢狀物件(§34遠征地圖)。全新欄位理論上會被上面的泛用檢查整包補上,
  // 但「已經玩過遠征」的存檔 save.expedition 已經存在(不是undefined),之後再往裡面加
  // 欄位時淺層檢查就補不到了——先寫好防呆,免得下一輪加欄位時舊存檔直接白屏
  if (!save.expedition || typeof save.expedition !== "object") save.expedition = { usage:{}, runs:0, clears:{} };
  if (!save.expedition.usage || typeof save.expedition.usage !== "object") save.expedition.usage = {};
  if (!save.expedition.clears || typeof save.expedition.clears !== "object") save.expedition.clears = {};
  if (typeof save.expedition.runs !== "number") save.expedition.runs = 0;
  // 舊存檔是單一 activePetId(字串),多寵物出戰改成 activePetIds(陣列)——
  // 上面泛用的欄位遷移只會補「完全沒有這個欄位」的情況,這裡額外把舊格式資料轉過去
  if (save.activePetId !== undefined) {
    if (!save.activePetIds || !save.activePetIds.length) save.activePetIds = save.activePetId ? [save.activePetId] : [];
    delete save.activePetId;
  }
  if (!Array.isArray(save.activePetIds)) save.activePetIds = [];
  // 寵物突破/天賦系統上線:S.pets[fid] 從 {lv,kills,shiny} 擴充成
  // {lv,kills,shiny,star,traits,sigOverride,retraitUsed}。舊存檔一律補成 star:0 /
  // 已抽好的 traits / sigOverride:null——所有既有的 pet.lv / pet.shiny 判斷都不受影響。
  // traits 是隨機的,補抽而不是留空,舊玩家的寵物才不會變成「永遠沒有個體差異」的次等公民。
  if (!save.petMarks || typeof save.petMarks !== "object") save.petMarks = {};
  Object.keys(save.pets || {}).forEach(fid=>{
    const p = save.pets[fid];
    if (typeof p.star !== "number") p.star = 0;
    if (!Array.isArray(p.traits) || !p.traits.length) p.traits = randomPetTraits();
    if (p.sigOverride === undefined) p.sigOverride = null;
    if (typeof p.retraitUsed !== "boolean") p.retraitUsed = false;
  });
  // 龍蛋成長系統上線前就已經打過第10層以上的舊存檔,原本只有「打贏當下那一層」才會補龍蛋,
  // 導致已經爬過去的樓層永遠補不回來——這裡改成每次讀檔都用目前樓層回推「本來應該長到哪一階」,
  // 只補漲不倒退,讓補過關卡的舊存檔也能追上進度
  const clearedUpTo = Math.max(0, save.floor - 1);
  const catchUpStage = dragonStageForFloor(Math.floor(clearedUpTo / 10) * 10);
  if (clearedUpTo >= 10 && catchUpStage > save.dragonStage) save.dragonStage = catchUpStage;
  // 龍的種類(小朋友反饋:請隨機):第一次有龍蛋以上進度、但還沒抽過血統的存檔,補抽一次
  if (save.dragonStage >= 0 && !save.dragonSpecies) save.dragonSpecies = randomDragonSpecies();
  // 血脈天賦(小朋友反饋:精進龍蛋機制):第一次有龍蛋以上進度、但還沒抽過天賦的存檔,補抽一次
  if (save.dragonStage >= 0 && !save.dragonTrait) save.dragonTrait = randomDragonTrait();
  // 特別彩蛋:用特定名字登入送專屬禮物(+固定血量上限),名字比對忽略大小寫/前後空白,
  // 只在第一次讀檔時發放,不會因為改名大小寫而重複發放或收回
  if (!save.specialPet) {
    const gift = SPECIAL_LOGIN_GIFTS[normalizeChildName(save.child)];
    if (gift) save.specialPet = gift.id;
  }
  // 家族武器(小朋友要求):達成特定里程碑會解鎖對應的家族武器,讀檔時一併檢查追趕,
  // 避免已經在玩、里程碑早就達成的存檔要等到下一次觸發點才補發
  grantFamilyWeapons(save);
  // 成就系統同理:已經在玩的存檔可能早就達成某些成就的條件(例如已經打到70層),
  // 讀檔時一併追趕檢查,不用等到下一次剛好觸發winFloor/dailyDone才補發
  grantAchievements(save);
  // everWrong欄位是這次修bug才新增的(見engine.js的mistakeBookOnAnswer)——舊存檔的錯題本
  // 完全沒有這個欄位,但小朋友反饋「已經打到33層,更新完要把之前的錯題都呈現在錯題區」,
  // 用既有資料裡最接近的線索回推:streak===0且尚未畢業,代表上一次(或唯一一次)遇到這個字
  // 時答錯了(答對streak會變成>=1),用這個當「這是不是真的錯過」的合理推斷——已經在玩的舊
  // 存檔可以把過去真正答錯的字實際呈現在複習區,同時不會把「只是還沒複習到第二次」的正常
  // 新字(streak===1)誤判成錯題,避免重蹈之前假錯題塞爆門檻的覆轍。
  Object.keys(save.mistakeBook).forEach(w=>{
    const rec = save.mistakeBook[w];
    if (rec.everWrong===undefined) rec.everWrong = (rec.streak===0 && !rec.graduated);
  });
  // 故事日誌只在 startIntro() 真的被呼叫的當下才會記錄——跟龍蛋一樣的問題:
  // 玩家在這個功能存在以前就已經爬過的樓層,劇情台詞永遠補不回來,存檔一讀就是空的。
  // 讀檔時依目前樓層回推,把所有「應該已經看過」的台詞通通補進storyLog(logStory的dedup guard
  // 保證不會補出重複,已經看過的不會被洗掉,只補漏,不影響往後正常前進時即時記錄的行為)。
  for (let f=1; f<=save.floor; f++){
    if (RANK_ENTRY_LINES[f]) backfillStory(save, f, RANK_ENTRY_LINES[f]);
    if (isMonarch(f) && MONARCH_TAUNTS[f]) backfillStory(save, f, MONARCH_TAUNTS[f]);
    if (f===90) backfillStory(save, f, "『……這座塔,其實是「訓練模擬系統」。每一個「測試者」的數據,都會被記錄下來,延續給下一個爬上這裡的人。你不是唯一一個。』");
    if (OBSERVER_FLOORS[f]) backfillStory(save, f, OBSERVER_FLOORS[f]);
  }
  save.storyLog.sort((a,b)=>a.floor-b.floor);
  return save;
}
function backfillStory(save, floor, text){
  if (!save.storyLog.some(e=>e.floor===floor && e.text===text)) save.storyLog.push({ floor, text });
}
function doLogin(){
  const name=document.getElementById("nameInput").value.trim();
  if(!name) return;
  rememberPlayer(name);
  CHILD=name;
  S=hydrateSave(loadSave(name)||newSave());
  view = S.cls ? "home" : "classPick";
  render();
  startPlayTimeHeartbeat();
}

// 也是「約第40層就滿等、後面60層完全沒成長」的直接原因之一。
// 改成隨樓層放大(第1~24層 ×1、25~49 ×2、50~74 ×3、75~99 ×4、100層 ×5),
// 配合 engine.js 把等級上限從16拉到40,後期才升得動。
// 2026-08-11:塔延伸到130層,LEVEL_EXP上限同步40→70——只加大上限、不加大這裡的
// exp水龍頭,新的30級只會變成看得到打不到的天花板。101層起exp/題另外加速成長。
function expPerAnswer(){
  const f = S.floor||1;
  if (f > 100) return 5 + Math.floor((f-100)/5)*2;
  return 1 + Math.floor(f/25);
}

// ---------- 懸賞令:把「我的弱點」重新框成「我的獵物」 ----------
// 現行的錯題複習只有被門檻擋下才會去,是「被逼的」不是「想玩的」。懸賞令用同一份錯題資料
// 換一個框架:首頁常駐3張懸賞卡,寫「懸賞:abandon — 你曾被牠打敗2次 — 賞金80🔧」。
// 畢業即自動結算,不需要小孩額外按「領取」(多一個按鈕就多一個他不會去按的理由)。
function ensureBounties(){
  if (!S.bounties) S.bounties = [];
  // 已經畢業的懸賞先結算掉
  claimFinishedBounties();
  const due = dueMistakeWords();
  const already = new Set(S.bounties.map(b=>b.word));
  const candidates = due.filter(w=>!already.has(w));
  while (S.bounties.length < BOUNTY_SLOTS && candidates.length) {
    const word = candidates.shift();
    const rec = S.mistakeBook[word] || {};
    S.bounties.push({ word, wrongCount: rec.wrongCount||1, reward: bountyReward(rec.wrongCount) });
  }
}
function claimFinishedBounties(){
  if (!S.bounties || !S.bounties.length) return [];
  const done = S.bounties.filter(b=>{ const r=S.mistakeBook[b.word]; return r && r.graduated; });
  if (!done.length) return [];
  done.forEach(b=>{ S.mods += b.reward; S.bountyClaimed = (S.bountyClaimed||0)+1; });
  S.bounties = S.bounties.filter(b=>!done.includes(b));
  saveGame(); // 賞金是真的錢,結算完立刻落地,不能等下一次存檔時機
  return done;
}
// 答題後即時結算(讓獎勵緊貼著「我剛剛答對了」那一刻,不是等回到首頁才發現)
function settleBountiesAfterAnswer(){
  const done = claimFinishedBounties();
  done.forEach(b=>floatText(`🎯『懸賞達成:${b.word} — 賞金 🔧${b.reward}!』`));
  return done.length;
}
function renderBountyBoard(){
  ensureBounties();
  if (!S.bounties.length) {
    return `<div class="navSectionTitle">🎯 懸賞令</div>
      <div class="sub">目前沒有懸賞目標——你的錯題本是乾淨的。</div>`;
  }
  return `<div class="navSectionTitle">🎯 懸賞令</div>
    <div class="sub">這些字曾經打敗過你。讓牠們畢業就能領賞。</div>
    ${S.bounties.map(b=>{
      const w = WORDS.find(x=>x.word===b.word);
      return `<div class="gearRow"><div><b>${b.word}</b>
        <div class="sub">${w?w.zh_tw:""} ｜ 你曾被牠打敗 ${b.wrongCount} 次</div></div>
        <div><span class="tag">賞金 🔧${b.reward}</span></div></div>`;
    }).join("")}`;
}

// ---------- 宿敵系統:把抽象的錯題人格化 ----------
// 某個字錯滿3次 → 附身到一隻怪身上成為專屬宿敵,之後陰魂不散地現身嘲諷,
// 連續答對2次才淨化。視覺完全複用既有16家族,不需要新素材。
function maybeCreateNemesis(word){
  if (S.nemesis) return null; // 一次只養一個死對頭,免得變成一長串待辦清單
  const rec = S.mistakeBook[word];
  if (!shouldBecomeNemesis(rec)) return null;
  const fam = MONSTER_FAMILIES[Math.abs(hashStr(word)) % MONSTER_FAMILIES.length];
  S.nemesis = { word, famId: fam.id, famName: fam.name, emoji: fam.emoji,
    streak: 0, bornFloor: S.floor, seed: Math.abs(hashStr(word)) };
  return S.nemesis;
}
function hashStr(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return h; }
function nemesisDisplayName(){
  if (!S.nemesis) return "";
  return `${S.nemesis.emoji}${S.nemesis.famName}・${S.nemesis.word}`;
}
// 宿敵答題結算:連續答對2次淨化,答錯歸零重來(但不扣命——這是心理戰不是懲罰)
function onNemesisAnswer(correct){
  if (!S.nemesis) return;
  if (correct) {
    S.nemesis.streak++;
    if (S.nemesis.streak >= NEMESIS_PURIFY_STREAK) {
      const n = S.nemesis;
      S.purified = S.purified || [];
      if (!S.purified.some(p=>p.word===n.word)) S.purified.push({ word:n.word, famId:n.famId, emoji:n.emoji, famName:n.famName });
      const reward = 150 + (S.mistakeBook[n.word] ? (S.mistakeBook[n.word].wrongCount||1)*40 : 40);
      S.mods += reward;
      S.scrolls = (S.scrolls||0) + 1;
      // 淨化＝這個字也直接畢業(牠已經被你連續打敗兩次,沒有再罰寫的道理)
      const rec = S.mistakeBook[n.word];
      if (rec) { rec.graduated = true; rec.streak = Math.max(rec.streak, 2); }
      S.nemesis = null;
      floatText(`⚡『宿敵「${n.word}」已被淨化!🔧+${reward} ＋📜殘卷×1』`);
    } else {
      floatText(`💢『再一次……再答對一次就能淨化牠。』`);
    }
  } else {
    S.nemesis.streak = 0;
    floatText(`👹『${nemesisTaunt(S.nemesis.seed)}』`);
  }
}

// ---------- 五賢者遺物:各件效果的取用點 ----------
// 每件的效果都是「改機制」而不是「傷害×N」,因為 adjustedBossHp 血量安全網會把純數值成長
// 吃掉(練越強血越厚),做成乘數的話小孩會覺得穿了跟沒穿一樣。
function epicG(){ return S.epicGear || (S.epicGear = {}); }
function mistakeGraduateStreak(){ return epicHas(epicG(),"emblem") ? EPIC_GRADUATE_STREAK : 2; }
function comboCapNow(){ return epicHas(epicG(),"grip") ? EPIC_COMBO_CAP : 12; }
function chestPityThreshold(){ return epicHas(epicG(),"charm") ? EPIC_CHEST_PITY : 9; }
function epicSetStageNow(){ return epicSetStage(epicG()); }
// 5件套「賢者共鳴」:答對的字如果是自己曾經錯過的,傷害雙倍——直接把複習變成最強的攻擊手段
function epicResonanceMult(word){
  if (epicSetStageNow() < 3) return 1;
  const rec = S.mistakeBook[word];
  return (rec && rec.everWrong) ? EPIC_SET5_RESONANCE_MULT : 1;
}
function gainExp(n){
  S.exp += Math.round(n * (1 + (gearExpBonusPct(S.gear)+dragonTraitExpBonusPct())/100));
  const newLv = levelFromExp(S.exp);
  if (newLv > S.charLevel) {
    const diff = newLv - S.charLevel;
    S.jobLv[S.cls] = (S.jobLv[S.cls]||0) + diff;
    S.charLevel = newLv;
  }
}

function displayBossName(f){
  if (floorEpic) return floorEpic.emoji + floorEpic.name;

// 「曾經真的答錯過」的字(含已畢業)——史詩怪的破解題與塔內異象都從這裡抽,
// 所以就算當下錯題本是空的也永遠有內容可考(mistakeBook 的紀錄永久保留不刪)
function everWrongWords(){
  const cleared = new Set(cumulativeWords(Math.max(1,S.floor-1)).map(w=>w.word));
  return Object.keys(S.mistakeBook).filter(w=>S.mistakeBook[w].everWrong && cleared.has(w));
}
// 錯題軟門檻:積欠超過這個數量才擋下不准爬塔(原本是>0的硬鎖)
function mistakeGateLimit(){ return S.floor >= 71 ? 12 : 6; }

function logStory(floor, text){

  // 本身已經是高強度關卡,再疊史詩護盾會變成兩倍疲勞)。
  floorEpic = null;

  if (!floorEpic && !isMonarch(f) && rollOmenEvent(f) && everWrongWords().length >= 4) {

  if (f===90) lines.push("『……這座塔,其實是「訓練模擬系統」。每一個「測試者」的數據,都會被記錄下來,延續給下一個爬上這裡的人。你不是唯一一個。』");

  // 一行小字,跟武器/命數等戰鬥資訊擠在一起,存在感很弱。改成有劇情的樓層先跳出一個獨立的

function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }

// 魔像怪檢查點(§第50層後每5層):考題優先抽「這個範圍內曾經真的答錯過的字」(就算已經畢業,
// mistakeBook紀錄永久保留不會被刪除),不夠的話用該範圍全部已教過的字補滿——抓的是「答對但
// 沒真的記熟」這個現有錯題本機制抓不到的洞,不是只抓字面上的「未畢業錯題」(那個早就被
// dueMistakeCount 強制擋掉了,走到這裡理論上是空的)。
// 2026-08-01小朋友要求把份量從20拉高到50(原本跟一般樓層小怪波同量),錯題優先、
// 不夠再補其他已教字,不會因為錯題不夠50個就卡住進不了魔像怪關卡
const GOLEM_WORD_COUNT = 50;
function golemWordPool(floor){
  const cleared = cumulativeWords(floor-1);
  const clearedWordSet = new Set(cleared.map(w=>w.word));
  const everMistaken = Object.keys(S.mistakeBook).filter(w=>clearedWordSet.has(w));
  const prioritized = shuffle(cleared.filter(w=>everMistaken.includes(w.word)));
  const rest = shuffle(cleared.filter(w=>!everMistaken.includes(w.word)));
  return prioritized.concat(rest).slice(0, GOLEM_WORD_COUNT);
}
// 101層以後:題目來源改成「該樓層所屬主題區域,依會用精通度加權抽樣」(見§34/regionForFloor),
// 完全不用1-100層那套「floor N = 第N批20字」的固定切片,也不套用舊題型輪替(golem/revenge/
// dueExtra/宿敵插入那些機制都是為了1-100層的固定字表設計的,101層以後的字都是舊字,
// 用同一套邏輯反而不對)。獨立分支、不流進下面的舊邏輯。
function startWave101Plus(f){
  const region = regionForFloor(f);
  let order = pickExpeditionWords(expeditionRegionWords(WORDS, region), S.expedition.usage, waveSizeForFloor(f));
  // ⚠️ 真的bug,已修正:宿敵現身的插入邏輯原本只寫在1-100層的startWave()裡,
  // 101層以後走這支獨立函式,宿敵從此再也不會出現——但首頁橫幅還照樣寫「牠會自己
  // 找上門」。宿敵字不一定在當前區域字表裡(可能是任何曾經錯過的字),插入邏輯
  // 跟1-100層一致,只是不需要再檢查!variant(這裡本來就恆是cloze)。
  window.__nemesisAppeared = null;
  if (S.nemesis && !isMonarch(f) && f > S.nemesis.bornFloor && Math.random() < NEMESIS_APPEAR_CHANCE) {
    const nw = WORDS.find(w=>w.word===S.nemesis.word);
    if (nw) {
      order = order.filter(w=>w.word!==nw.word);
      order.splice(Math.floor(order.length/2), 0, nw);
      window.__nemesisAppeared = S.nemesis;
    }
  }
  quizState = { phase:"wave", variant:"cloze", pool:order, order, idx:0, streak:0, waveMistakes:0, bonusIdx:null,
    eventChestsLeft:0, nextCounterHp:null, ultimateUsed:false, chargeMode:false, region };
  view="quiz"; render();
}
function startWave(){
  const f=S.floor, variant=variantForFloor(f);
  if (f > 100) { startWave101Plus(f); return; }
  let pool = floorWords(f);
  if (variant==="revenge") {
    const due = Object.keys(S.mistakeBook).filter(w=>!S.mistakeBook[w].graduated);
    pool = due.length ? WORDS.filter(w=>due.includes(w.word)) : pool;
  } else if (variant==="golem") {
    pool = golemWordPool(f);
  }
  let order = shuffle(pool);
  // 70層以上題量放大(家長需求):多出來的題目用「已教過的舊字」補,不能真的多發新字
  // (單字分配是 2000÷20 的硬約束)。所以這是「更長」不是「更難」——winFloor 的獎勵
  // 會依實際題量等比提高,不會變成「做更多工、拿一樣的錢」。
  if (!variant && !isMonarch(f)) {
    const want = waveSizeForFloor(f);
    if (order.length < want) {
      const have = new Set(order.map(w=>w.word));
      const older = shuffle(cumulativeWords(f-1).filter(w=>!have.has(w.word)));
      order = order.concat(older.slice(0, want - order.length));
    }
  }
  const dueExtra = Object.keys(S.mistakeBook).filter(w=>mistakeIsDue(S.mistakeBook,w,S.qCounter)).slice(0,dueExtraLimitForFloor(f));
  if (dueExtra.length && variant!=="revenge" && variant!=="golem") {

    // 改成隨機插進中段,分散開來。
    const extras = WORDS.filter(w=>dueExtra.includes(w.word));
    extras.forEach(w=>{ order.splice(Math.floor(Math.random()*(order.length+1)), 0, w); });
  }
  // 內容密度(參考地下城設計:不能讓玩家一路只有固定節奏)——平常樓層小怪波偶爾(25%機率)
  // 藏一題「稀有單字」,答對有額外改裝點獎勵,不用等到每5層才有一次變格層驚喜
  // 宿敵現身:牠不會乖乖等你去複習,而是自己找上門(只在一般樓層,不跟特殊關卡搶戲)
  window.__nemesisAppeared = null;
  if (S.nemesis && !variant && !isMonarch(f) && f > S.nemesis.bornFloor && Math.random() < NEMESIS_APPEAR_CHANCE) {
    const nw = WORDS.find(w=>w.word===S.nemesis.word);
    if (nw) {
      order = order.filter(w=>w.word!==nw.word); // 避免同一層重複出現兩次
      order.splice(Math.floor(order.length/2), 0, nw); // 塞中段,不放開頭也不放結尾
      window.__nemesisAppeared = S.nemesis;
    }
  }
  const bonusIdx = (!variant && !isMonarch(f) && order.length && Math.random()<0.25) ? Math.floor(Math.random()*order.length) : null;
  quizState = { phase:"wave", variant, pool, order, idx:0, streak:0, waveMistakes:0, bonusIdx,
    eventChestsLeft: variant==="event"?3:0, nextCounterHp:null, ultimateUsed:false, chargeMode:false };
  view="quiz"; render();
}

    const isDecade = isDecadeFloor(S.floor) && S.floor<=100;

    // ⚠️ 真的bug,已修正:原本挑target字用的是sealPool/cumulativeWords,但傳給
