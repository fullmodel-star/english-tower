    choicesHtml = `<div class="choices" id="choiceBox">${choices.map(c=>
      `<button class="choice" onclick="answer('${escapeStr(c)}','${escapeStr(reverse?target.word:target.zh_tw)}')">${c}</button>`).join("")}</div>`;
  }
  const jobSkill = JOB_SKILLS[S.cls];
  const jl = S.jobLv[S.cls]||0;
  const canSkill1 = isBoss && qs.streak>=5 && !S.__skillCharged1;
  const canSkill2 = isBoss && jobUnlocks(jl).secondSkill && qs.streak>=8 && !S.__skillCharged2;
  // §37雙生刻印:副職業(S.subCls)的兩個絕招永久掛在技能列上,門檻跟主職業一致(streak
  // 5/8),但看的是副職業自己的職業等級(S.jobLv[S.subCls])——不用重新練,重生前練過
  // 這個職業到哪裡,副職業技能就已經解鎖到哪裡
  const subJobSkill = S.subCls ? JOB_SKILLS[S.subCls] : null;
  const subJl = S.subCls ? (S.jobLv[S.subCls]||0) : 0;
  const canSubSkill1 = isBoss && !!S.subCls && qs.streak>=5 && !S.__subSkillCharged1;
  const canSubSkill2 = isBoss && !!S.subCls && jobUnlocks(subJl).secondSkill && qs.streak>=8 && !S.__subSkillCharged2;
  const bossPct = isBoss ? qs.bossHp/qs.bossMax : 1;
  const bossPhaseClass = bossPct<=0.25 ? "phase3" : bossPct<=0.5 ? "phase2" : "";
  // 每一層的怪物都要有形象(小朋友反饋):不只boss戰,小怪波/隨機事件層也一起顯示同一層的
  // 妖魔家族emoji,boss戰才疊加血量門檻變色跟受擊特效,小怪波單純當作「這關的敵人長相」
  const monsterStage = !isEvent ? `<div class="bossStage"><div class="bossEmoji ${isBoss?bossPhaseClass:""} ${floorShinyRoll?"shiny":""}" id="bossEmoji">${monsterVisual(S.floor)}</div><div class="fxLayer" id="fxLayer"></div></div>` : "";
  // 連擊累積感(音效/打擊感會議建議):連擊≥5/≥10時給整張戰鬥卡加呼吸發光邊框
  const comboClass = qs.streak>=10 ? "comboGlow10" : qs.streak>=5 ? "comboGlow5" : "";
  app.innerHTML = `<div class="card battleCard ${isBoss?comboClass:""}">
    ${isBoss ? `${monsterStage}
      <div class="row"><span>⚔️ ${displayBossName(S.floor)}</span><span>${qs.bossHp}/${qs.bossMax}</span></div>
      <div class="barwrap"><div class="barfill boss" style="width:${Math.max(0,100*qs.bossHp/qs.bossMax)}%"></div></div>
      ${qs.sealHp>0?`<div class="sysmsg" style="margin:6px 0;">🌫️ 封印護盾 ${"◈".repeat(qs.sealHp)}${"◇".repeat(Math.max(0,(qs.sealMax||0)-qs.sealHp))}
        <br><span class="sub">答對「你曾經錯過的字」才能剝掉一層。答錯不扣命數。</span></div>`:""}
      <div class="row"><span>命數 ❤️${S.livesCur}/${S.livesMax}</span><span>連擊 <span class="streakNum">x${qs.streak}</span></span></div>`
    : isEvent ? `<div class="row"><span>🎲 隨機事件層</span><span>剩餘寶箱 ${qs.eventChestsLeft}</span></div>
      ${window.__eventMsg?`<div class="sysmsg">${window.__eventMsg}</div>`:""}`
    : `${monsterStage}
      <div class="row"><span>${cloze?`${region.emoji}${region.name}`:qs.variant?({timed:"⏱️限時波",revenge:"💢錯題復仇",golem:"🗿魔像怪"}[qs.variant]||"小怪波"):"小怪波"}</span><span>${qs.idx+1} / ${qs.order.length}</span></div>
      <div class="barwrap"><div class="barfill" style="width:${100*qs.idx/qs.order.length}%"></div></div>`}
    ${(qs.variant==="timed" && !isBoss) || (isBoss && hasAbility("timeSqueeze")) || (cloze && region.rule==="timed" && !isBoss) ? `<div class="barwrap"><div class="barfill timer" id="timerBar" style="width:100%"></div></div>` : ""}
    ${isBoss && activeAbilities.length ? `<div class="sysmsg">${activeAbilities.map(id=>{const a=BOSS_ABILITIES.find(x=>x.id===id); return a.emoji+a.name;}).join(" ")}!『魔王發動了絕招!』</div>` : ""}
    <div class="tagsRow">${window.__isWeak?`<span class="tag weak">⚡弱點</span>`:""}${window.__isGolden?`<span class="tag golden">✨黃金題</span>`:""}</div>
    ${(S.nemesis && S.nemesis.word===target.word)
      ? `<div class="nemesisBanner">👹 宿敵現身:${nemesisDisplayName()}<br>
          <span class="sub">${nemesisTaunt(S.nemesis.seed)} 連續答對 ${S.nemesis.streak}/${NEMESIS_PURIFY_STREAK} 次淨化。</span></div>` : ""}
    ${cloze ? `<div class="sub">${region.name}・${clozeOk?"例句填空":"字義題(這個字的例句沒辦法挖空)"}${region.rule==="hint"?"(🔊有提示)":region.rule==="timed"?"(限時)":"(五選一)"}</div>`:""}
    <div class="word ${window.__isWeak?"weak":""} ${window.__isGolden?"golden":""} ${(S.nemesis && S.nemesis.word===target.word)?"nemesis":""} ${clozeOk?"cloze":""}">${clozeOk
      ? escapeHtml(clozeBlankInfo.before)+'<b style="color:var(--gold);">＿＿＿</b>'+escapeHtml(clozeBlankInfo.after)
      : (hideWordText ? target.zh_tw : target.word)}</div>
    <div class="pos">${(clozeOk || hideWordText) ? "" : (target.pos||"")}</div>
    ${(!reverse || (cloze && region.rule==="hint")) && !(isBoss && hasAbility("silence")) ? `<button onclick="speakWord('${escapeStr(target.word)}')">🔊 聽發音${cloze&&region.rule==="hint"?"(提示)":""}</button>` : ""}
    ${choicesHtml}
    ${cloze ? `<div class="sub" id="clozeReveal" style="margin-top:6px;min-height:1.4em;"></div>` : ""}
    <div class="sub" style="margin-top:8px;">${curWeapon().name} Lv${S.weaponLv[S.weaponId]}${S.evolved[S.weaponId]?(evolveStage(S.evolved[S.weaponId])>=2?"・極型":"・覺醒型"):""}</div>
    ${qs.fusionLeft>0 ? `<div class="sysmsg" style="margin-top:6px;">⚡『${twinComboTitle(S.cls,S.subCls)}・覺醒合體中!』兩個職業的力量同時全開,剩 ${qs.fusionLeft} 題。</div>` : ""}
    ${isBoss ? `<div style="margin-top:6px;">
        <button class="toggleBtn ${qs.chargeMode?'on':''}" onclick="toggleCharge()">🔥蓄力模式:${qs.chargeMode?"開(下次命中x1.6,未命中額外扣命)":"關"}</button>
        ${canSkill1?`<button onclick="useSkill1()">💠${jobSkill.name}</button>`:""}
        ${canSkill2?`<button onclick="useSkill2()">💠${jobSkill.skill2}</button>`:""}
        ${canSubSkill1?`<button onclick="useSubSkill1()">🌗${subJobSkill.name}(副)</button>`:""}
        ${canSubSkill2?`<button onclick="useSubSkill2()">🌗${subJobSkill.skill2}(副)</button>`:""}
      </div>` : ""}
    ${isBoss && S.dragonStage>=1 ? `<div style="margin-top:6px;">
        <div class="barwrap"><div class="barfill" style="width:${Math.min(100,(qs.dragonBreathGauge||0))}%;background:var(--gold);"></div></div>
        ${dragonBreathReady(qs)
          ? `<button class="primary" onclick="useDragonBreath()">🐲龍息全滿!點擊施放(${dragonBreathEffectFor(S.dragonSpecies).label})</button>`
          : `<div class="sub">🐲龍息槽 ${Math.floor(qs.dragonBreathGauge||0)}/${DRAGON_BREATH_MAX}(答對累積,連擊越高越快)</div>`}
      </div>` : ""}
    ${isBoss && S.subCls ? `<div style="margin-top:6px;">
        <div class="barwrap"><div class="barfill" style="width:${Math.min(100,(qs.fusionGauge||0))}%;background:var(--gold);"></div></div>
        ${fusionReady(qs)
          ? `<button class="primary" onclick="useFusion()">🌀覺醒合體槽全滿!點擊施放(接下來5題兩個職業全力發揮)</button>`
          : `<div class="sub">🌀覺醒合體槽 ${Math.floor(qs.fusionGauge||0)}/${FUSION_GAUGE_MAX}(答對累積,連擊越高越快)</div>`}
      </div>` : ""}
  </div>
  ${!isEvent ? `<div class="petBattleRow">${S.activePetIds.filter(fid=>S.pets[fid]).map(fid=>{
    const pet=S.pets[fid], fam=MONSTER_FAMILIES.find(f=>f.id===fid);
    return `<div class="petBattleIcon ${petSignatureUnlocked(pet.lv)?"awakened":""} ${pet.shiny?"shiny":""}" id="petBattle_${fid}" title="${fam.name}">${familySpriteHtml(fid,"familySprite")}<span class="lv">${pet.lv}</span></div>`;
  }).join("")}</div>` : ""}`;
  window.__curTarget = target;
  window.__onAnswer = onAnswer;
  if (spellMode) document.getElementById("spellInput").focus();
  if (qs.variant==="timed" && !isBoss) startTimer();
  if (cloze && region.rule==="timed" && !isBoss) startTimer(EXPEDITION_TIMED_MS/100);
  if (isBoss && hasAbility("timeSqueeze")) startTimer(25); // 2026-08-01調鬆:1.8→2.5秒(原本太趕),仍比限時波(3秒)略緊
}

function toggleCharge(){ quizState.chargeMode = !quizState.chargeMode; render(); }
function useSkill1(){ S.__skillCharged1 = true; window.__skillMsg="疾風連斬/標定/金鋼盾/屬性爆發 已蓄勢待發!"; render(); }
function useSkill2(){ S.__skillCharged2 = true; render(); }
// §37雙生刻印:副職業的兩個絕招,獨立蓄力狀態,不跟主職業的S.__skillCharged1/2共用
function useSubSkill1(){ S.__subSkillCharged1 = true; render(); }
function useSubSkill2(){ S.__subSkillCharged2 = true; render(); }

// ---------- 覺醒合體槽(§37):完全比照龍息槽的做法(答對累積、連擊越高越快、
// 玩家自己決定何時施放),但獨立於龍息槽,只要有S.subCls就會充能——不用等孵蛋。
// gauge存在quizState裡不是S,道理跟龍息槽一樣:「這一層」的資源,每層開始自然歸零。
// 施放後接下來5題(qs.fusionLeft)兩個職業的被動全力疊加,是玩家主動觸發的情境加成,
// 不算進computeAttackBreakdown()的穩定期望值——跟連擊/黃金題/龍息同一個安全網原則。
const FUSION_GAUGE_MAX = 100;
function gainFusion(qs){
  if (!S.subCls) return;
  qs.fusionGauge = Math.min(FUSION_GAUGE_MAX, (qs.fusionGauge||0) + dragonBreathGain(qs.streak));
}
function fusionReady(qs){ return !!S.subCls && (qs.fusionGauge||0) >= FUSION_GAUGE_MAX; }
function useFusion(){
  const qs = quizState;
  if (qs.phase!=="boss" || !fusionReady(qs)) return;
  qs.fusionGauge = 0;
  qs.fusionLeft = 5;
  towerSfx("pet");
  floatText(`🌀『${twinComboTitle(S.cls,S.subCls)}・覺醒合體!』`);
  render();
}

let timerHandle=null;
function startTimer(ticks){
  ticks = ticks || 30; // 預設30 ticks(100ms/tick)=3秒,魔王「時間緊縮」絕招會傳更短的ticks
  clearInterval(timerHandle);
  let pct=100;
  const bar=document.getElementById("timerBar");
  timerHandle=setInterval(()=>{
    pct -= 100/ticks;
    if (bar) bar.style.width = Math.max(0,pct)+"%";
    if (pct<=0){ clearInterval(timerHandle); forceWrong(); }
  }, 100);
}
function forceWrong(){
  document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  speakWord(window.__curTarget.word);
  if (!quizState.noProgress) {
    S.qCounter++;
    mistakeBookOnAnswer(S.mistakeBook, window.__curTarget.word, false, S.qCounter, mistakeGraduateStreak());
  }
  // 超時強制判定答錯,跟 answer() 的答錯路徑一樣要算進 waveMistakes,
  // 否則「零錯題全對」的寵物馴服判定會被超時鑽漏洞(超時不算錯題,誤判成全對)
  quizState.waveMistakes = (quizState.waveMistakes||0)+1;
  setTimeout(()=>window.__onAnswer(false), 400);
}

function escapeStr(s){ return String(s).replace(/'/g,"\\'"); }
// §34遠征地圖新增:例句是拼接進 innerHTML 的文字內容(不是onclick屬性),雖然字表是
// 我們自己寫死的靜態資料沒有真的XSS風險,順手做HTML escape比較乾淨,不留壞習慣
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function submitSpell(){
  const val=document.getElementById("spellInput").value.trim().toLowerCase();
  answer(val, window.__curTarget.word.toLowerCase(), true);
}

function answer(picked, correctVal, isSpell){
  // 拼字題沒有像選擇題那樣把按鈕disable鎖住,快速連點「送出」會在callback跑完前把同一題
  // 送出兩次(winFloor()/gainExp()等於被重複結算兩份獎勵)。用這個旗標統一擋掉所有模式的
  // 重複送出,直到下一題 renderQuestion() 真的上場才解鎖。
  if (__answering) return;
  __answering = true;
  clearInterval(timerHandle);
  const correct = picked.toLowerCase() === correctVal.toLowerCase();
  speakWord(window.__curTarget.word); // 小朋友反饋:點完之後想聽到單字發音
  // 動效節奏會議建議:按下的瞬間就要有立即回饋(anticipation預備動作),
  // 不能等到500ms後攻擊特效才動,魔王先抖一下「準備挨打」
  if (quizState.phase==="boss") triggerAnticipate();
  if (!isSpell) {
    document.querySelectorAll(".choice").forEach(btn=>{
      if (btn.textContent===correctVal) btn.classList.add("correct");
      else if (btn.textContent===picked && !correct) btn.classList.add("wrong");
      btn.disabled=true;
    });
  }
  // 回聲之塔明確承諾「不影響本傳進度」,答題不能真的動到角色經驗值/錯題本
  if (!quizState.noProgress) {
    S.qCounter++;
    const answeredWord = window.__curTarget.word;
    mistakeBookOnAnswer(S.mistakeBook, answeredWord, correct, S.qCounter, mistakeGraduateStreak());
    // 101層以後(§34):額外記一份「會用」精通度,下次同一區域抽題時優先抽還沒精通的字
    if (quizState.variant==="cloze") expeditionUsageOnAnswer(S.expedition.usage, answeredWord, correct);
    if (correct) gainExp(expPerAnswer());
    // 宿敵:先結算「這題就是宿敵」的情況,再判斷有沒有新的字錯滿3次要變成宿敵
    if (S.nemesis && S.nemesis.word === answeredWord) onNemesisAnswer(correct);
    else if (!correct) {
      const born = maybeCreateNemesis(answeredWord);
      if (born) floatText(`👹『「${born.word}」化作了${born.famName}——牠成了你的宿敵。』`);
    }
    // 懸賞令:畢業即時結算,讓獎勵緊貼著「我剛剛答對了」那一刻
    settleBountiesAfterAnswer();
  } else if (quizState.trialMode && correct) {
    gainExp(expPerAnswer());
  }
  if (!correct) quizState.waveMistakes = (quizState.waveMistakes||0)+1;
  // ⚠️ 真的bug,已修正:cloze題答完只有按鈕變色就在260~400ms內跳下一題,例句的完整句子/
  // 中譯/字尾變化提醒(engine.js的clozeBlank早就算好了inflected/matched)從來沒有被
  // 顯示過——這正是§34設計初衷要教的東西(答案選carry,句子裡卻是carries,要讓小孩看到
  // 為什麼),卻整段消失。補上揭曉文字(填進renderQuestion預留的#clozeReveal),並且
  // 延長停留時間,不然0.4秒根本讀不完一句話。
  if (quizState.variant==="cloze") {
    const t = window.__curTarget;
    const blank = clozeBlank(t.word, t.ex);
    const revealEl = document.getElementById("clozeReveal");
    if (revealEl) {
      const parts = [];
      if (!correct) parts.push("正解:" + t.word);
      if (blank.ok && blank.inflected) parts.push("句子裡要用「" + blank.matched + "」這個變化形");
      if (blank.ok) parts.push(t.ex + (t.exZh ? "(" + t.exZh + ")" : ""));
      else parts.push(t.zh_tw + (t.exZh ? "・" + t.exZh : ""));
      revealEl.textContent = parts.join("・");
    }
  }
  // ⚠️ 2026-08-01小朋友反饋「打怪速度太快」:原本砍到250ms左右的節奏對小朋友來說太趕,
  // 常常還沒看清楚下一題就跳過去——調鬆回一個中間值,不是完全退回最早期的500ms
  // cloze題額外拉長(要讀完一句英文例句+中譯,0.4秒不夠)
  const delay = quizState.variant==="cloze" ? (correct?1600:2000)
    : isSpell ? (correct?220:170) : (correct?400:260);
  setTimeout(()=>window.__onAnswer(correct), delay);
}

function onWaveAnswer(correct){
  const qs=quizState;
  const bonus = qs.variant==="timed" ? 2 : 1;
  if (correct){
    qs.streak++; S.mods += 2*bonus; S.petFeed += petFeedGainNow();
    gainDragonBreath(qs);
    towerSfx("hit"); triggerBossHit(false);
    if (window.__curTarget) battleCry(window.__curTarget.word); // 參考Cryptmaster:答對的單字本身就是攻擊的吶喊
    // 小怪波也帶寵物一起打(小朋友反饋:每次都要能帶寵物加入戰鬥,不是只有boss戰才看得到牠)
    // 多寵物出戰時每次只隨機挑一隻擲機率,避免多寵物疊加太誇張(兩位專家建議的防疊加上限)
    const activeFid = pickRandomActivePet();
    if (activeFid && !quizState.noProgress) {
      const strike = petStrike(petStrikeCtx(activeFid, S.floor, qs.streak));
      if (Math.random() < strike.chance) {
        const pet = S.pets[activeFid];
        // 小怪波給的是🔧不是傷害,所以用星級/剋制加成去縮放,而不是直接吃 strike.dmg
        const affinity = petAffinityMult(activeFid, familyForFloor(S.floor).id);
        const petBonus = Math.max(1, Math.round((1 + Math.ceil(pet.lv/3)) * petStarMult(pet.star) * affinity));
        S.mods += petBonus;
        triggerPetLunge(activeFid);
        floatText(`+${petBonus}🔧 🐾寵物助攻!${affinity>1?" 屬性剋制!":""}`); towerSfx("pet");
      }
    }
    // 內容密度(參考地下城設計):小怪波裡藏的「稀有單字」,答對額外給改裝點獎勵
    if (qs.idx===qs.bonusIdx) {
      const rareBonus = 5 + Math.floor(Math.random()*8);
      S.mods += rareBonus;
      floatText(`✨稀有單字!+${rareBonus}🔧`); towerSfx("pet");
    }
  } else { qs.streak=0; towerSfx("miss"); }
  qs.idx++;
  render();
}

function startBoss(){
  const f=S.floor;
  const isGolem = quizState.variant==="golem";
  quizState.phase="boss";
  quizState.bossHp = adjustedBossHp(f); // §13.5動態安全網:進boss戰當下算一次,戰鬥中不會浮動
  if (isGolem) quizState.bossHp = Math.round(quizState.bossHp * GOLEM_HP_MULT); // 魔像怪血量極厚
  // 史詩怪:血量只加 1.4 倍(刻意不用魔像怪的 2.0)——護盾階段已經吃掉一段時間,
  // 血量再厚會變成兩倍疲勞。節奏是「解謎→宣洩」,不是「解謎→更長的苦工」。
  if (floorEpic) {
    quizState.bossHp = Math.round(quizState.bossHp * EPIC_HP_MULT);
    quizState.sealHp = epicSealCount();
    quizState.sealMax = quizState.sealHp;
    quizState.sealPool = shuffle(WORDS.filter(w=>everWrongWords().includes(w.word)));
    quizState.sealMissStreak = 0;
  }
  quizState.bossMax = quizState.bossHp;
  quizState.streak = 0;
  // 魔像怪反擊更密集:counterStepPct除以GOLEM_COUNTER_MULT讓門檻間距縮小,逼玩家不能靠蠻力硬闖
  const counterPct = isGolem ? counterStepPct(curRank().key)/GOLEM_COUNTER_MULT : counterStepPct(curRank().key);
  quizState.counterPctOverride = isGolem ? counterPct : null;
  quizState.nextCounterHp = Math.round(quizState.bossMax * (1 - counterPct));
  quizState.revivedThisFight = false;
  // ---- 五賢者遺物:進場時生效的效果 ----
  quizState.bossQIdx = 0;                        // 遺物瞄準鏡用:第3題必定黃金題
  quizState.epicReviveUsed = false;              // 遺物護甲:每場戰鬥免死一次
  const __setStage = epicSetStageNow();
  if (__setStage >= 1 && S.livesCur < S.livesMax) S.livesCur++;           // 2件套
  if (__setStage >= 2) quizState.streak = 3;                              // 4件套:開場3連擊
  // 敏捷(agi)屬性點的「連擊容錯」:每場戰鬥開始重新計算容錯次數,原本這個數值只在
  // statShop文案裡承諾過,沒有任何地方真的套用(§4「連擊中斷的容錯門檻」)
  quizState.comboBuffer = Math.floor(statComboBonus(effectiveStats()));
  S.__skillCharged1=false; S.__skillCharged2=false;
  S.__subSkillCharged1=false; S.__subSkillCharged2=false; // §37雙生刻印:每場戰鬥開始重新充能
  // 家族武器都是「每場戰鬥限用1次」,每次進boss戰重新充能
  quizState.dadLoveUsed=false; quizState.momWrathUsed=false; quizState.grandpaShoutUsed=false;
  render();
}

function onBossAnswer(correct){
  const qs=quizState, wid=S.weaponId;
  // ---- 史詩怪封印護盾:一般攻擊全部被彈開,只有答對「破解題」才剝掉一層 ----
  // 答錯刻意不扣命、不觸發反擊:史詩怪的稀有度本身就有壓力,再疊懲罰就是逼小孩關掉 App。
  // 唯一的成本是時間。連錯兩次自動給首字母提示,不讓他卡死在同一個字上。
  if (qs.sealHp > 0) {
    if (correct) {
      qs.sealHp--; qs.sealMissStreak = 0; qs.streak++;
      S.mods += 2; S.petFeed += petFeedGainNow();
      towerSfx("hit");
      floatText(qs.sealHp > 0
        ? `💥『封印剝落一層!還剩 ${qs.sealHp} 層。』`
        : `🔓『封印全破——牠的護盾沒了,上!』`);
    } else {
      qs.sealMissStreak = (qs.sealMissStreak||0) + 1;
      qs.streak = 0;
      const hint = (qs.sealMissStreak >= 2 && window.__curTarget)
        ? `提示:這個字是 ${window.__curTarget.word[0]}...` : "";
      floatText(`🌫️『你的攻擊被黑霧彈開了。』${hint}`);
    }
    saveGame();
    setTimeout(()=>render(), 420);
    return;
  }
  if (correct){
    qs.streak++;
    S.mods += 2; S.petFeed += petFeedGainNow();
    gainDragonBreath(qs);
    gainFusion(qs);
    // 精通綁在職業上,不是單一武器(電玩檢討:換武器不該連帶精通歸零重練)
    S.classHits[S.cls] = (S.classHits[S.cls]||0)+1;
    let dmg = calcDamage(curWeapon(), S.weaponLv[wid], S.classHits[S.cls], qs.streak, S.gear, comboCapNow());
    // 五賢者遺物5件套「賢者共鳴」:答對的字如果是自己曾經錯過的,傷害雙倍
    dmg = Math.round(dmg * epicResonanceMult(window.__curTarget ? window.__curTarget.word : ""));
    dmg = Math.round(dmg * statDmgMult(effectiveStats()));
    if (S.evolved[wid]) dmg = Math.round(dmg * evolveMult(S.evolved[wid]));
    if (window.__isWeak) dmg = Math.round(dmg * (CLASS_META[S.cls].weakBonus ? 1.5+CLASS_META[S.cls].weakBonus : 1.5));
    if (window.__isGolden) dmg *= 2;
    // 天賦樹「爆發」分支:弱點/黃金題觸發時額外倍率(每點+2%),不影響一般命中的傷害
    if ((window.__isWeak || window.__isGolden)) {
      const burstPts = (S.talents[S.cls]||{}).burst||0;
      if (burstPts>0) dmg = Math.round(dmg * talentBurstMult(burstPts));
    }
    // 刺客連擊成長加成/元素使屬性剋制加成(CLASS_META裡原本宣告了卻沒有任何地方套用)
    if (CLASS_META[S.cls].comboBonus) dmg = Math.round(dmg * (1 + CLASS_META[S.cls].comboBonus * qs.streak));
    // 天賦樹「連擊」分支:讓連擊本身的傷害成長更快(每點每連擊格外+0.4%),
    // 跟calcDamage()裡原本的連擊乘區(0.06/格)是同一種效果分開疊加,不動calcDamage本身
    { const comboPts = (S.talents[S.cls]||{}).combo||0;
      if (comboPts>0) dmg = Math.round(dmg * (1 + qs.streak * talentComboBonusPerStack(comboPts))); }
    if (CLASS_META[S.cls].elemBonus) dmg = Math.round(dmg * (1 + CLASS_META[S.cls].elemBonus));
    // 職業等級Lv3被動(§16):練熟這個職業就有小幅永久加成
    if (jobUnlocks(S.jobLv[S.cls]||0).passive) dmg = Math.round(dmg * 1.05);
    // §37雙生刻印:副職業(S.subCls)的被動永久生效,但只有半效——跟主職業同時全效疊加會
    // 讓數值成長線失控。fusionLeft>0(覺醒合體中)時才臨時升到全效,那是玩家主動觸發的
    // 情境加成,結束後自動恢復半效,不影響adjustedBossHp()穩定期望值的計算(見下方
    // computeAttackBreakdown同步只算半效部分,全效差額放在situational)。
    if (S.subCls && S.subCls !== S.cls) {
      const fusionMult = qs.fusionLeft>0 ? 1 : 0.5;
      const sub = CLASS_META[S.subCls];
      if (sub.comboBonus) dmg = Math.round(dmg * (1 + sub.comboBonus * qs.streak * fusionMult));
      if (sub.elemBonus) dmg = Math.round(dmg * (1 + sub.elemBonus * fusionMult));
      if (jobUnlocks(S.jobLv[S.subCls]||0).passive) dmg = Math.round(dmg * (1 + 0.05 * fusionMult));
    }
    // 龍蛋成長系統:龍蛋孵化後(Lv1起)開始提供被動傷害加成,養到最強之龍加成最高
    if (S.dragonStage >= 1) dmg = Math.round(dmg * (1 + DRAGON_STAGES[S.dragonStage].bonus));
    // 血統屬性親和(小朋友反饋:精進龍蛋機制):打到跟自己龍血統同屬性的怪物,額外+10%傷害
    if (S.dragonStage >= 0 && S.dragonSpecies) {
      const species = DRAGON_SPECIES.find(sp=>sp.id===S.dragonSpecies);
      if (species && familyForFloor(S.floor).tag === species.affinityTag) dmg = Math.round(dmg * 1.1);
    }
    // 龍蛋血脈天賦「猛擊血脈」+羈絆餵養加成(兩者都跟成長階段加成分開算,疊加在一起)
    if (S.dragonStage >= 0) dmg = Math.round(dmg * (1 + dragonTraitDmgBonus() + dragonBondBonus(S.dragonBond)));
    if (qs.chargeMode) dmg = Math.round(dmg * 1.6);
    // 守護者的兩個技能charge(金鋼盾/不屈意志)是留給下面反擊判定/counterResolve用的專屬效果,
    // 不能被這裡的通用傷害加成當場吃掉——上一輪的bug就是:觸發反擊的正是「這一下攻擊」,
    // 但這裡搶先把charge花在傷害加成上,等程式走到反擊判定時charge已經是false,自動格擋/
    // 免死永遠不會真的生效。其他三職業沒有這個衝突,維持原本的通用傷害加成。
    const isGuardian = CLASS_META[S.cls].lifeBonus;
    if (S.__skillCharged1 && !isGuardian) { dmg = Math.round(dmg*1.3); S.__skillCharged1=false; }
    if (S.__skillCharged2 && !isGuardian) { dmg = Math.round(dmg*1.2); S.__skillCharged2=false; }
    // §37雙生刻印:副職業絕招同樣是半效(1.3→1.15/1.2→1.1),守護者副職業的charge留給
    // renderCounter/counterResolve用,道理跟主職業一致
    const subIsGuardian = S.subCls && CLASS_META[S.subCls].lifeBonus;
    if (S.__subSkillCharged1 && !subIsGuardian) { dmg = Math.round(dmg*1.15); S.__subSkillCharged1=false; }
    if (S.__subSkillCharged2 && !subIsGuardian) { dmg = Math.round(dmg*1.1); S.__subSkillCharged2=false; }
    // 家族武器「媽媽之怒」:連擊累積到15以上時,下一擊自動爆擊(傷害雙倍),每場戰鬥限用1次
    window.__momWrathProc = false;
    if (S.familyWeapons.momwrath && qs.streak>=15 && !quizState.momWrathUsed) {
      quizState.momWrathUsed = true;
      dmg = Math.round(dmg*2);
      window.__momWrathProc = true;
    }
    // 寵物自動攻擊 + Lv10覺醒絕招(PET_SIG_GROUP,原本4種效果都只是文案沒接邏輯,這次補上)
    let petProcDmg = 0;
    window.__petHealed = false;
    // 多寵物出戰時每次攻擊只挑一隻擲絕招(防疊加上限),但抽選是依等級/星級加權的,
    // 不是均勻隨機——新寵物加入隊伍不會再稀釋戰力。機率/傷害全部交給 engine.js 的
    // petStrike() 算,血量安全網 computeAttackBreakdown() 用的是同一個函式。
    window.__petAffinityProc = false;
    const bossProcFid = pickRandomActivePet();
    if (bossProcFid) {
      const pet = S.pets[bossProcFid];
      const strike = petStrike(petStrikeCtx(bossProcFid, S.floor, qs.streak));
      if (Math.random() < strike.chance) {
        const sigGroup = strike.sigGroup, sp = strike.sigPower;
        let thisProc = strike.dmg;
        petProcDmg += thisProc;
        // 連刃:小機率觸發第二次(★3後強化一檔;Lv5半效絕招的機率也砍半)
        if (sigGroup==="doubleProc" && Math.random()<petDoubleProcChance(sp, pet.star)) petProcDmg += thisProc;
        if (sigGroup==="lifeRecover" && Math.random()<petLifeRecoverChance(sp, pet.star) && S.livesCur<S.livesMax) { S.livesCur++; window.__petHealed=true; }
        dmg += petProcDmg;
        window.__petAffinityProc = petAffinityMult(bossProcFid, familyForFloor(S.floor).id) > 1;
        triggerPetLunge(bossProcFid);
      }
    }
    // 龍蛋每階絕招(小朋友反饋「每一階段都有絕招」):沿用寵物絕招同一套5種機制群組,
    // 站0(龍蛋)還沒孵化沒有絕招,站1起才開始擲機率
    let dragonProcDmgHit = 0;
    window.__dragonHealed = false; window.__dragonProcName = null;
    if (S.dragonStage >= 1) {
      const sig = DRAGON_SIGNATURES[S.dragonStage];
      let procChance = dragonAutoChance(S.dragonStage);
      if (sig.group==="procBoost") procChance *= 1.5;
      if (Math.random() < procChance) {
        let thisProc = dragonProcDmg(S.dragonStage, S.floor);
        if (sig.group==="dot") thisProc += 2;
        dragonProcDmgHit += thisProc;
        if (sig.group==="doubleProc" && Math.random()<0.2) dragonProcDmgHit += thisProc;
        if (sig.group==="lifeRecover" && Math.random()<0.15 && S.livesCur<S.livesMax) { S.livesCur++; window.__dragonHealed=true; }
        dmg += dragonProcDmgHit;
        window.__dragonProcName = sig.name;
      }
    }
    // 龍息槽:玩家主動施放後,下一次攻擊確定 ×3 傷害(不是機率,這是龍相對寵物的差異化)
    window.__dragonBreathProc = false;
    if (S.__dragonBreathCharged) {
      S.__dragonBreathCharged = false;
      dmg = Math.round(dmg * DRAGON_BREATH_DMG_MULT);
      window.__dragonBreathProc = true;
    }
    // 灼焰吐息:接下來3次攻擊追加燒傷,獨立於施放當下那一擊,持續消耗
    window.__dragonBurnDmg = 0;
    if ((qs.dragonBurnLeft||0) > 0) {
      qs.dragonBurnLeft--;
      const burn = dragonBreathBurnDmg(S.floor);
      dmg += burn;
      window.__dragonBurnDmg = burn;
    }
    const bossPctBefore = qs.bossHp/qs.bossMax; // 給音效依血量%動態調整音高/音量用
    qs.bossHp -= dmg;
    // 戰鬥視覺/音效回饋(打擊感/音效/動效節奏三方會議建議):
    // 職業特效立即起手(0ms)→命中震動+傷害數字(80ms)→全螢幕色閃確認結果(120ms),
    // 三段時間差做出「攻擊→命中→結果」的因果節奏,而不是全部同時發生看起來很擠。
    // hit-stop(命中定格)疊加在命中那一拍,是性價比最高的單一打擊感手法。
    const isCrit = window.__isWeak || window.__isGolden;
    towerSfx(isCrit?"crit":"hit", { bossPct: bossPctBefore });
    triggerClassFx(S.cls);
    setTimeout(()=>{ hitStop(isCrit?110:70); triggerBossHit(isCrit); damageNumber(dmg, isCrit); }, 80);
    setTimeout(()=>flashScreen("good"), 120);
    if (qs.streak>0 && qs.streak%5===0) towerSfx("streak", { streak: qs.streak });
    if (petProcDmg>0) { triggerPetLunge(); floatText(`+${petProcDmg} 🐾寵物助攻!${window.__petAffinityProc?" 屬性剋制!":""}`); towerSfx("pet"); }
    if (window.__petHealed) setTimeout(()=>floatText("❤️+1 🐾寵物治療!"), 200);
    if (dragonProcDmgHit>0) { floatText(`+${dragonProcDmgHit} 🐉${window.__dragonProcName}!`); towerSfx("pet"); }
    if (window.__dragonHealed) setTimeout(()=>floatText("❤️+1 🐉龍之守護!"), 200);
    if (window.__dragonBreathProc) { floatText("🐲龍息全力噴發!傷害 ×3!"); towerSfx("crit"); }
    if (window.__dragonBurnDmg>0) { setTimeout(()=>floatText(`+${window.__dragonBurnDmg} 🔥灼焰燒傷!`), 150); }
    if (window.__momWrathProc) { floatText("😡媽媽之怒!傷害雙倍!"); towerSfx("crit"); }
  } else {
    // 敏捷(agi)帶來的連擊容錯:有容錯次數時,答錯不會打斷連擊,只是消耗一次容錯
    if (qs.comboBuffer>0) qs.comboBuffer--; else qs.streak = 0;
    if (qs.chargeMode) { S.livesCur = Math.max(0, S.livesCur-1); }
    towerSfx("miss"); flashScreen("bad"); triggerBossMiss();
  }
  // §37覺醒合體:不論這題答對答錯,合體視窗都會倒數(「接下來5題」講的是題數不是命中數)
  if (qs.fusionLeft>0) qs.fusionLeft--;
  if (qs.bossHp<=0){ winFloor(); return; }
  // 魔王絕招「憤怒」:這題觸發的反擊(不管是哪個門檻觸發的)傷害加重一級
  const furyBump = (qs.activeAbilities||[]).includes("fury") ? 1 : 0;
  // 相位轉換/大絕招觸發判定
  if (!qs.ultimateUsed && qs.bossHp <= qs.bossMax*0.25) {
    qs.ultimateUsed = true;
    triggerCounter(2+furyBump);
    return;
  }
  if (qs.nextCounterHp!==null && qs.bossHp <= qs.nextCounterHp) {
    qs.nextCounterHp = Math.max(0, qs.nextCounterHp - Math.round(qs.bossMax*(qs.counterPctOverride||counterStepPct(curRank().key))));
    triggerCounter(1+furyBump);
    return;
  }
  // 魔王絕招「猛毒突襲」:這題沒有自然觸發到反擊門檻的話,強制多補一次(每題最多疊加1次,
  // 用完就清掉,不會連續好幾題都補觸發)
  if ((qs.activeAbilities||[]).includes("extraCounter")) {
    qs.activeAbilities = qs.activeAbilities.filter(id=>id!=="extraCounter");
    triggerCounter(1+furyBump);
    return;
  }
  render();
}

function triggerCounter(severity){
  quizState.counterSeverity = severity;
  quizState.counterDeadline = 40; // ticks (100ms) ≈4秒
  // 寵物「boss下次反擊小機率直接失效」覺醒絕招(elec/frost/bone/vine家族,原本只是文案)
  // 多寵物出戰時只在有此絕招的寵物裡隨機挑一隻擲機率,避免多寵物疊加
  // 走 petSigGroupOf() 而不是直接查 PET_SIG_GROUP,才吃得到「專精轉換」換過來的絕招;
  // 機率也改成隨 sigPower(Lv5半效/Lv10全效)與星級縮放,不再是寫死的 0.15
  let counterImmuneChance = 0, counterImmuneFid = null;
  S.activePetIds.forEach(fid=>{
    const pet = S.pets[fid];
    if (!pet || petSigPower(pet.lv)<=0 || petSigGroupOf(fid, pet)!=="counterImmune") return;
    const c = 0.15 * petSigPower(pet.lv) * (petStarSigBoost(pet.star) ? 1.5 : 1);
    if (c > counterImmuneChance) { counterImmuneChance = c; counterImmuneFid = fid; }
  });
  if (counterImmuneFid && Math.random()<counterImmuneChance) {
    floatText("🐾寵物擋下了這次反擊!");
    view="quiz"; render();
    return;
  }
  // 龍息「冰霜吐息」:主動施放後接下來2次反擊必定失效,不是機率——龍息槽整組機制的
  // 核心差異就是「確定 vs 機率」(寵物是被動小機率,龍息是玩家主動按下去的確定效果)
  if ((quizState.dragonBreathCounterImmuneLeft||0) > 0) {
    quizState.dragonBreathCounterImmuneLeft--;
    floatText("🐉冰霜吐息!反擊必定失效!");
    view="quiz"; render();
    return;
  }
  // 龍蛋「逆鱗庇護」等每階絕招(小朋友反饋「每一階段都有絕招」),機制跟寵物一樣,各自獨立判定
  if (S.dragonStage >= 1 && DRAGON_SIGNATURES[S.dragonStage].group==="counterImmune" && Math.random()<0.15) {
    floatText(`🐉${DRAGON_SIGNATURES[S.dragonStage].name}擋下了這次反擊!`);
    view="quiz"; render();
    return;
  }
  // 家族武器「爺爺之媽個巴基」:boss大絕招(severity>1)必定被擋下,每場戰鬥限用1次
  if (severity>1 && S.familyWeapons.grandpashout && !quizState.grandpaShoutUsed) {
    quizState.grandpaShoutUsed = true;
    floatText("👴爺爺之媽個巴基!把大絕招擋下來了!");
    view="quiz"; render();
    return;
  }
  // 家族武器「爸爸之愛」:每場戰鬥開始免費一次反擊格擋,不限severity,每場限用1次
  if (S.familyWeapons.dadlove && !quizState.dadLoveUsed) {
    quizState.dadLoveUsed = true;
    floatText("🛡️爸爸之愛,擋下了這次反擊!");
    view="quiz"; render();
    return;
  }
  towerSfx("counter");
  view="counter"; render();
  clearInterval(timerHandle);
  // renderCounter() 可能在 render() 內就同步呼叫 counterResolve()(守護者第二技自動格擋),
  // 這樣畫面已經離開"counter"了——這種情況不能再啟動倒數計時器,否則4秒後會冒出一顆
  // 跟畫面脫鉤的「幽靈扣血」,不管玩家當下在哪個畫面都會被憑空扣命。
  if (view !== "counter") return;
  timerHandle = setInterval(()=>{
    quizState.counterDeadline--;
    const bar=document.getElementById("counterBar");
    if (bar) bar.style.width = Math.max(0,quizState.counterDeadline/40*100)+"%";
    // 剩餘時間越少,呼吸縮放的節奏越快,壓迫感隨倒數遞增(動效節奏會議建議)
    const pulseEl = document.querySelector(".card.danger.pulse");
    if (pulseEl) {
      const remainPct = Math.max(0.15, quizState.counterDeadline/40);
      pulseEl.style.animationDuration = (0.6*remainPct + 0.15) + "s, 0.4s";
    }
    if (quizState.counterDeadline<=0){ clearInterval(timerHandle); counterResolve(false); }
  }, 100);
}
function renderCounter(){
  const qs=quizState;
  // 守護者「金鋼盾」(skill1)才是自動格擋,不是「不屈意志」(skill2,§16職業等級Lv6解鎖)
  const guardianAuto = CLASS_META[S.cls].lifeBonus && S.__skillCharged1;
  // §37雙生刻印:副職業如果是守護者,牠的金鋼盾一樣能自動格擋——主職業優先消耗,
  // 兩個都充能時不會同時觸發兩次(一次反擊只需要擋一次)
  const subGuardianAuto = !guardianAuto && S.subCls && CLASS_META[S.subCls].lifeBonus && S.__subSkillCharged1;
  // 打擊感會議建議:紅色vignette疊層+呼吸縮放的緊張壓迫感,不佔文件流高度
  app.innerHTML = `<div class="counterVignette"></div>
    <div class="card danger pulse" style="animation:bossShake .4s ease, dangerPulse .6s ease-in-out infinite;"><h1>⚠️ 魔王反擊!</h1>
    <div class="sysmsg">『${bossName(S.floor)}』準備發動${qs.counterSeverity>1?`【${BOSS_SIGNATURE_MOVES[S.floor]||"大絕招"}】`:"反擊"}!
      ${qs.counterSeverity>1?"未擋下扣2點命數":"未擋下扣1點命數"}</div>
    <div class="barwrap"><div class="barfill counter" id="counterBar" style="width:100%"></div></div>
    <button class="primary" onclick="counterResolve(true)">🛡️ 防禦</button></div>`;
  if (guardianAuto) { S.__skillCharged1=false; counterResolve(true); }
  else if (subGuardianAuto) { S.__subSkillCharged1=false; counterResolve(true); }
}
function counterResolve(defended){
  clearInterval(timerHandle);
  const qs=quizState;
  if (defended) towerSfx("defend");
  if (!defended) S.livesCur = Math.max(0, S.livesCur - qs.counterSeverity);
  if (S.livesCur<=0) {
    // 守護者「不屈意志」(skill2):命數歸零時,本場多一次免死機會(每場戰鬥限用一次)
    if (CLASS_META[S.cls].lifeBonus && S.__skillCharged2 && !qs.revivedThisFight) {
      S.livesCur = 1;
      qs.revivedThisFight = true;
      S.__skillCharged2 = false;
      view="quiz"; render();
      return;
    }
    // §37雙生刻印:副職業的「不屈意志」——跟主職業各自獨立的免死機會共用同一個
    // qs.revivedThisFight旗標(每場戰鬥限用一次,不因為雙職業變成兩次)
    if (S.subCls && CLASS_META[S.subCls].lifeBonus && S.__subSkillCharged2 && !qs.revivedThisFight) {
      S.livesCur = 1;
      qs.revivedThisFight = true;
      S.__subSkillCharged2 = false;
      view="quiz"; render();
      return;
    }
    // 遺物護甲:每場戰鬥命數歸零時免死一次(跟守護者「不屈意志」各自獨立,可以各用一次)
    if (epicHas(epicG(),"armor") && !qs.epicReviveUsed) {
      S.livesCur = 1;
      qs.epicReviveUsed = true;
      floatText("🛡️『遺物護甲亮起——這一次,你還沒倒下。』");
      view="quiz"; render();
      return;
    }
    view="fail"; render(); return;
  }
  view="quiz"; render();
}
function renderFail(){
  towerSfx("defeat");
  app.innerHTML = `<div class="card danger"><h1>💀 力竭</h1>
    <div class="sysmsg">『命數歸零。測試者,重新振作。』本層將重新挑戰,命數重新回滿。</div>
    <button class="primary" onclick="retryFloor()">重新挑戰本層</button></div>`;
}
function retryFloor(){ refillLives(); view="intro"; render(); }

function winFloor(){
  const f=S.floor;
  const c = rollChest(curRank().key, S.pity, totalLuckPct(), chestPityThreshold());
  S.mods += c.mods; S.pity = c.nextPity;
  // 70層以上小怪波題量放大(waveSizeForFloor)之後,獎勵必須等比跟上——否則就變成
  // 「做更多工、拿一樣的錢」,那才是真正打擊信心的地方,不是題目變多本身。
  window.__lengthBonus = null;
  { const ratio = waveSizeForFloor(f) / 20;
    if (ratio > 1) { const bonus = Math.round(c.mods * (ratio - 1)); S.mods += bonus; window.__lengthBonus = bonus; } }
  // 史詩遭遇獎勵:保底史詩寶箱等值 + 殘卷 + 五賢者遺物(保證不重複,遇到第5隻必定湊滿)
  window.__epicKill = null; window.__epicPiece = null; window.__epicScrolls = 0;
  if (floorEpic) {
    const bonus = Math.round(c.mods * 2) + 120;
    S.mods += bonus;
    S.epicKills[floorEpic.id] = (S.epicKills[floorEpic.id]||0) + 1;
    const scrolls = scrollDropCount();
    S.scrolls = (S.scrolls||0) + scrolls;
    window.__epicScrolls = scrolls;
    const piece = nextEpicPiece(epicG());
    if (piece) { epicG()[piece.slot] = EPIC_SET_ID; window.__epicPiece = piece; }
    window.__epicKill = { monster: floorEpic, bonus };
  }
  // 提前挑戰boss的風險獎勵(地下城設計反饋:給玩家主動選擇風險程度的空間)
  window.__riskRushBonus = null;
  if (quizState.riskRush) {
    const bonus = Math.round(c.mods*0.5);
    S.mods += bonus;
    window.__riskRushBonus = bonus;
  }
  // 怪物異色版本(小朋友反饋):擊敗異色版有額外獎勵
  window.__wasShiny = floorShinyRoll;
  if (floorShinyRoll) { const bonus = Math.round(c.mods*1.5); S.mods += bonus; window.__shinyBonus = bonus; }
  // 魔像怪檢查點:血量極厚+反擊密集,通過要給明顯高於一般樓層的獎勵(複習值得被獎勵,
  // 不是只有「沒被卡關」而已——呼應「複習就該有回饋」的既有設計原則,不是純懲罰機制)
  window.__golemBonus = null;
  if (quizState.variant==="golem") { const bonus = Math.round(c.mods*2); S.mods += bonus; window.__golemBonus = bonus; }
  const fam = familyForFloor(f);
  S.codexKills[fam.id] = (S.codexKills[fam.id]||0)+1;
  // 寵物馴服判定:零錯題全對 或 錯題復仇層清空
  const qs=quizState;
  const tamed = (qs.waveMistakes===0) || (qs.variant==="revenge");
  window.__tamedFamily = null; window.__tamedShiny = false; window.__petMarkGained = null;
  // 重複馴服 → 馴服印記(電玩檢討的頭號結構問題):S.pets 用家族id當key,家族只有16個,
  // 所以第17層之後只要那個家族已經有寵物,零錯題全對的獎勵就是 nil——「答得又快又準」
  // 這條 SPEC §20 明講的核心動機,在遊戲進行到約兩成時就徹底熄火,剩下八成的完美作答
  // 完全不給回饋。改成:已擁有時改給該家族 1 枚印記,拿去做 ★ 突破,後期的完美作答
  // 永遠有去處,而且是綁定屬性家族的——孩子會為了強化火系主動去挑火系樓層拚全對。
  if (tamed && S.pets[fam.id]) {
    S.petMarks[fam.id] = (S.petMarks[fam.id]||0) + 1;
    window.__petMarkGained = fam;
  }
  if (tamed && !S.pets[fam.id]) {
    const shiny = rollPetShiny(); // 寵物異色版本(小朋友反饋)
    // 追趕機制:後期才馴服到的寵物如果一律從 Lv1 餵起,那時剩餘題數根本養不起,
    // 理性玩法會變成「永遠不餵」,反過來砍掉後期追求零錯題全對的動機
    const maxLv = Math.max(1, ...Object.values(S.pets).map(p=>p.lv||1));
    S.pets[fam.id] = { lv: petStartLevel(maxLv), kills:0, shiny,
      star:0, traits: randomPetTraits(), sigOverride:null, retraitUsed:false };
    // 剛馴服的寵物,若出戰欄位還有空位(依角色等級決定上限),自動加入出戰隊伍
    if (S.activePetIds.length < petSlotCount(S.charLevel)) S.activePetIds.push(fam.id);
    window.__tamedFamily = fam; window.__tamedShiny = shiny;
  }
  // 變格層(計時/聽力/拼寫/事件/復仇)過關回復1命(小朋友反饋:血量要有恢復機制;
  // 只在變格層生效,不含君主層,避免跟君主戰的高強度節奏衝突)
  // ⚠️ 真的bug,已修正:101層以後qs.variant恆是"cloze"(每一層都變格),原本「每5層
  // 才回1命」的密度變成「每層都回」,101-130幾乎死不了。改成跟1-100層一樣的密度——
  // 每5層(且非君主層)才回復,不是每層都回。
  window.__healedOnVariant = false;
  const healEligible = qs.variant && MONARCH_FLOORS.indexOf(f)===-1
    && (qs.variant!=="cloze" || (f-100)%5===0);
  if (healEligible && S.livesCur < S.livesMax) {
    S.livesCur++;
    window.__healedOnVariant = true;
  }
  // 龍蛋成長系統:每十層一次個別獎勵,從寶箱裡的特殊材料養成龍,一路長成最強之龍
  window.__dragonGrew = null;
  if (isDecadeFloor(f)) {
    const newStage = dragonStageForFloor(f);
    if (newStage > S.dragonStage) {
      S.dragonStage = newStage;
      if (!S.dragonSpecies) S.dragonSpecies = randomDragonSpecies(); // 小朋友反饋:龍的種類請隨機
      if (!S.dragonTrait) S.dragonTrait = randomDragonTrait(); // 小朋友反饋:精進龍蛋機制,孵化時骰血脈天賦
      window.__dragonGrew = dragonStageInfo(newStage, S.dragonSpecies);
    }
  }
  window.__reward = c.mods; window.__chestTier = c.tier; window.__isEvent=false;
  window.__flavor = CHEST_FLAVOR[Math.floor(Math.random()*CHEST_FLAVOR.length)];
  // 第FLOOR_CAP層通關要立刻把「已通關」這件事存進存檔,不能等玩家在終章畫面按下按鈕才算數——
  // 否則玩家看完回憶殺、還沒按繼續就關掉分頁/重新整理,下次登入會顯示「進入第FLOOR_CAP層」
  // 而不是通關,終章的一次性內容就再也看不到,君主戰也可能被重複觸發一次。
  if (f===FLOOR_CAP) S.floor = FLOOR_CAP+1;
  floorEpic = null; // 本層的史詩遭遇已結算,不能帶到下一層
  // 家族武器(小朋友要求):通關全塔(爸爸之愛)、圖鑑收集滿50隻(爺爺之媽個巴基)
  // 都可能剛好在這次過關跨過門檻,即時檢查解鎖
  window.__familyWeaponGrew = grantFamilyWeapons();
  // 成就系統:樓層/圖鑑/寵物/龍/武器覺醒都可能剛好在這次過關跨過門檻,即時檢查解鎖
  window.__achievementsGrew = grantAchievements();
  saveGame();
  towerSfx("victory");
  view = (f===FLOOR_CAP) ? "finale" : "victory";
  render();
}

// 第100層終章加碼:回憶殺(抓玩家自己走過的紀錄)+ 圖鑑/寵物列隊聲援 + 黑屏停頓

  memories.push("翠鳴森林、豐收市集、動詞荒原:你認得的每一個字,在這裡重新學會了怎麼用。");

    <div class="paradeRow">${petEntries.map((f,i)=>`<div class="paradeItem" style="animation-delay:${memories.length*0.4+0.8+i*0.15}s">${familySpriteHtml(f.id,"familySpriteParade")}<span class="cap">${f.name}</span></div>`).join("")}</div>`:""}

function nextFloor(){

// ============================================================
// §36 重生劇情(100→101層之間的過場):傳送門開啟→合體魔王(注定落敗)→重生變強
// ============================================================

// 答錯也不會真的扣命」的一次性劇本演出,硬接進主線戰鬥系統風險遠大於自己寫一套。
const REBIRTH_FIGHT_LEN = 6; // 固定6題,不論答對答錯,演完就進入落敗畫面

let bridgeState = null;
function startCombinedBoss(){
  const pool = shuffle(cumulativeWords(99)).slice(0, REBIRTH_FIGHT_LEN);

function doEvolve(id){
  const lv=S.weaponLv[id]||0, kills=S.classHits[S.cls]||0;
  const stage = evolveStage(S.evolved[id]);
  const classMax = S.classEvolvedMax[S.cls]||0;

  if (stage===0) {

// ---------- 能力總覽(小朋友反饋:攻擊力/防禦力/寵物能力都應該一覽表呈現)----------
// 傷害/命數散落在武器庫/裝備庫/屬性點/龍窩好幾個畫面各自才看得到一小塊,這裡統一算成
// 一個「目前實際數字」,並列出每一項加成分別貢獻多少,方便小朋友知道現在多強、練哪裡最有感
// 出戰隊伍每題的期望寵物傷害:每次只會有一隻出手,所以是「各寵物的抽中權重 × 自己的
// chance×dmg」的加權平均,不是總和。情境型加成(屬性剋制/護主/勤學連擊)刻意不算進來——
// 跟上面 calcDamage(streak=0) 排除連擊是同一個原則:安全網只吃穩定期望值。
function expectedPetDmg(){
  const pool = S.activePetIds.filter(fid=>S.pets[fid]);
  if (!pool.length) return 0;
  const weights = pool.map(fid=>petPickWeight(S.pets[fid]));
  const total = weights.reduce((a,b)=>a+b,0);
  if (total<=0) return 0;
  let sum = 0;
  pool.forEach((fid,i)=>{
    const st = petStrike({ fid, pet:S.pets[fid], floor:S.floor, floorFamilyId:null,
      streak:0, lives:S.livesMax, isBossFloor:false, dailyStreak:0 });
    sum += (weights[i]/total) * st.chance * st.dmg;
  });
  return Math.round(sum);
}
// 龍絕招的期望傷害,跟 expectedPetDmg() 同一個原則:只算穩定機率×傷害,不含procBoost
// 以外的機率修正情境(那些跟連擊一樣算「戰鬥中才變動」)
function expectedDragonDmg(){
  if (S.dragonStage < 1) return 0;
  const sig = DRAGON_SIGNATURES[S.dragonStage];
  let chance = dragonAutoChance(S.dragonStage);
  if (sig.group==="procBoost") chance *= 1.5;
  let dmg = dragonProcDmg(S.dragonStage, S.floor);
  if (sig.group==="dot") dmg += 2;
  return Math.round(chance * dmg);
}
function computeAttackBreakdown(){
  const w = curWeapon();
  const wLv = S.weaponLv[S.weaponId]||1;
  const kc = S.classHits[S.cls]||0;
  let dmg = calcDamage(w, wLv, kc, 0, S.gear); // streak=0:排除連擊這種戰鬥中才變動的加成,單純看基礎值
  const items = [{label:`${w.name}(Lv${wLv})基礎傷害(已含武器等級/精通/瞄準鏡裝備加成)`, dmg}];
  const stats = effectiveStats();
  const strMult = statDmgMult(stats);
  if (stats.str>0) { dmg = Math.round(dmg*strMult); items.push({label:`力量屬性(str ${stats.str})`, dmg}); }
  if (S.evolved[S.weaponId]) { dmg = Math.round(dmg*evolveMult(S.evolved[S.weaponId])); items.push({label:evolveStage(S.evolved[S.weaponId])>=2?"武器極化":"武器覺醒", dmg}); }
  if (CLASS_META[S.cls].elemBonus) { dmg = Math.round(dmg*(1+CLASS_META[S.cls].elemBonus)); items.push({label:"元素使屬性加成", dmg}); }
  if (jobUnlocks(S.jobLv[S.cls]||0).passive) { dmg = Math.round(dmg*1.05); items.push({label:"職業等級Lv3被動 +5%", dmg}); }
  // §37雙生刻印:副職業被動半效,穩定生效不是情境加成,所以要折進安全網(跟寵物/龍絕招
  // 同一條紅線)。覺醒合體(全效)才是玩家主動觸發的情境加成,放在下面situational。
  if (S.subCls && S.subCls !== S.cls) {
    const sub = CLASS_META[S.subCls];
    if (sub.elemBonus) { dmg = Math.round(dmg*(1+sub.elemBonus*0.5)); items.push({label:`副職業(${sub.name})屬性加成(半效)`, dmg}); }
    if (jobUnlocks(S.jobLv[S.subCls]||0).passive) { dmg = Math.round(dmg*1.025); items.push({label:"副職業Lv3被動(半效) +2.5%", dmg}); }
  }
  if (S.dragonStage>=1) { dmg = Math.round(dmg*(1+DRAGON_STAGES[S.dragonStage].bonus)); items.push({label:"龍之成長加成", dmg}); }
  const traitBonus = S.dragonStage>=0 ? dragonTraitDmgBonus() : 0;
  if (traitBonus>0) { dmg = Math.round(dmg*(1+traitBonus)); items.push({label:"龍血脈天賦(猛擊血脈)", dmg}); }
  const bondBonus = S.dragonStage>=0 ? dragonBondBonus(S.dragonBond) : 0;
  if (bondBonus>0) { dmg = Math.round(dmg*(1+bondBonus)); items.push({label:`龍羈絆(${S.dragonBond}/10)`, dmg}); }
  // ⚠️ 寵物期望傷害必須折進來(電玩檢討的紅線):寵物傷害原本完全不在這個函式裡,而
  // adjustedBossHp() 正是用這裡的 finalDmg 反推血量修正——等於血量安全網對寵物那塊戰力
  // 完全盲目。以前寵物只佔總DPS約2~4%還撐得住,但突破/天賦/剋制上線後寵物會成長到一成
  // 以上,安全網若繼續看不見它,魔王就會不知不覺越來越軟。這裡用加權平均的期望值
  // (chance×dmg,不含屬性剋制/護主這些戰鬥中才成立的情境加成,跟上面「排除連擊」一致)。
  const petExpected = expectedPetDmg();
  if (petExpected>0) { dmg += petExpected; items.push({label:`寵物出戰隊伍(期望助攻)`, dmg}); }
  // 龍絕招期望傷害(同一條紅線):dragonProcDmg 樓層縮放上線後,龍絕招也可能貢獻到有感
  // 戰力,一樣要折進安全網,不能只靠寵物那邊補。龍息槽刻意不算進來(跟連擊/弱點題同一個
  // 原則——那是玩家主動觸發的情境加成,不是穩定期望值)。
  const dragonExpected = expectedDragonDmg();
  if (dragonExpected>0) { dmg += dragonExpected; items.push({label:"龍之絕招(期望傷害)", dmg}); }
  const situational = [];
  if (CLASS_META[S.cls].comboBonus) situational.push(`連擊加成:每連擊額外+${Math.round(CLASS_META[S.cls].comboBonus*100)}%(隨連擊數疊加,不含在上方數字)`);
  if (CLASS_META[S.cls].weakBonus) situational.push("弱點題傷害加成更高(狙擊手專屬)");
  if (isMasterSniperCapstone(S.cls, S.weaponId, S.weaponLv[S.weaponId]||0, S.classHits[S.cls]||0)) situational.push("🎯 大師精通:必中弱點爆擊(L115A3・極型專屬,不再吃機率骰)");
  if (curWeapon() && curWeapon().archetype) situational.push(SNIPER_ARCHETYPE_TEXT[curWeapon().archetype] + "(武器族被動,不含在上方數字)");
  if (S.dragonStage>=0 && S.dragonSpecies) {
    const species = DRAGON_SPECIES.find(sp=>sp.id===S.dragonSpecies);
    situational.push(`龍血統親和:打「${species.affinityTag}」屬性怪物額外+10%(不含在上方數字)`);
  }
  if (S.familyWeapons.momwrath) situational.push("家族武器「媽媽之怒」:連擊15以上,下一擊自動雙倍爆擊(每場戰鬥1次)");
  const burstPts = (S.talents[S.cls]||{}).burst||0;
  if (burstPts>0) situational.push(`天賦樹「爆發」分支:弱點/黃金題觸發時額外+${Math.round((talentBurstMult(burstPts)-1)*100)}%(不含在上方數字)`);
  const comboPts = (S.talents[S.cls]||{}).combo||0;
  if (comboPts>0) situational.push(`天賦樹「連擊」分支:每連擊格外+${(talentComboBonusPerStack(comboPts)*100).toFixed(1)}%(隨連擊數疊加,不含在上方數字)`);
  if (S.subCls && S.subCls !== S.cls) {
    const sub = CLASS_META[S.subCls];
    if (sub.comboBonus) situational.push(`副職業(${sub.name})連擊加成(半效):每連擊額外+${(sub.comboBonus*50).toFixed(1)}%(不含在上方數字)`);
    situational.push(`🌀覺醒合體:能量槽全滿時可施放,接下來5題副職業被動全效(不含在上方數字)`);
  }
  return { finalDmg: dmg, items, situational };
}

// ---------- 魔王血量動態安全網(§13.5)----------
// 小朋友反饋:武器/裝備/職業/天賦這些成長系統疊起來,傷害輸出跟樓層血量曲線本來就會脫鉤——
// 練越快血量曲線就顯得越弱,魔王實質上「越來越弱」而非「越來越強」。這裡補上規格書§13.5
// 早就設計好、但一直沒真的接上engine.js的動態調整:進boss戰當下算一次「目前配置的預期
// 平均傷害」(用computeAttackBreakdown()的靜態期望值,不含黃金題/爆擊/連擊這些隨機或
// 戰鬥中才變動的加成),跟「這層血量曲線隱含的基準傷害」比較,做±12.5%~±25%的血量修正
// (只當安全網,不做完全同步,練得越強依然打得越快)。
const BOSS_HP_EXPECTED_HITS = { normal: 17, decadeKing: 27, monarch: 40 };
// clamp範圍隨段位放寬(§13.5數值平衡會議修正):武器等級×精通×進化×裝備×職業被動×天賦
// 疊到A/S級時偏離幅度很容易超過±25%,只給E/D級±25%的話後期形同虛設
// ⚠️ 真的bug,已修正:§35把塔延伸到130層時漏了傳說/神話/終焉三個新段位——沒補值的話
// 靠下面 adjustedBossHp() 的 `|| 0.25` 悄悄退回E/D級最窄的範圍,而101-130層的數值堆疊
// (等級70/武器Lv12/裝備T8)遠比A/S級誇張,用最窄橡皮筋等於後期完全鎖死打怪速度感,
// 跟這裡的設計精神(疊得越兇越要放寬)完全相反。延續同一個放寬趨勢往後加。
const BOSS_HP_CLAMP_BY_RANK = { E:0.25, D:0.25, C:0.35, B:0.35, A:0.5, S:0.5, 決戰:0.5,
  傳說:0.5, 神話:0.55, 終焉:0.6 };
function expectedHitsForFloor(floor){
  if (isMonarch(floor)) return BOSS_HP_EXPECTED_HITS.monarch;
  if (isDecadeKing(floor)) return BOSS_HP_EXPECTED_HITS.decadeKing;
  return BOSS_HP_EXPECTED_HITS.normal;
}
// 血量曲線本來就是照「一般玩家用當時解鎖的武器打幾下算合理」設計的,基準傷害直接從
// 血量曲線反推(基準血量÷預期命中次數),不用另外維護一張「各樓層應有傷害」的資料表,
// 兩份數字才不會兜不起來
function adjustedBossHp(floor){
  const baseHp = floorBaseHP(floor);
  const baselineDmg = baseHp / expectedHitsForFloor(floor);
  const actualDmg = Math.max(1, computeAttackBreakdown().finalDmg); // 防呆:避免除以0
  const deviationRatio = actualDmg / baselineDmg;
  const clampRange = BOSS_HP_CLAMP_BY_RANK[rankOf(floor).key] || 0.25;
  const clamped = Math.max(-clampRange, Math.min(clampRange, deviationRatio - 1));
  return Math.max(1, Math.round(baseHp * (1 + clamped * 0.5)));
}
function computeDefenseBreakdown(){
  const stats = effectiveStats();
  const base = rankLives(curRank().key);
  const vitBonus = statMaxLifeBonus(stats);
  const gearBonus = gearLifeBonus(S.gear);
  const special = specialLifeBonus();
  const talentBonus = talentSurvivalBonusForClass(S.cls);
  const items = [{label:"段位基礎命數", val:base}];
  if (vitBonus>0) items.push({label:`體力屬性(vit ${stats.vit})`, val:vitBonus});
  if (gearBonus>0) items.push({label:"護甲裝備", val:gearBonus});
  if (special>0) items.push({label:`${specialGiftInfo().label}彩蛋`, val:special});
  if (talentBonus>0) items.push({label:"天賦樹「生存」分支", val:talentBonus});
  const comboCut = gearComboCut(S.gear) + Math.floor(statComboBonus(effectiveStats()));
  const situational = [];
  if (S.familyWeapons.dadlove) situational.push("家族武器「爸爸之愛」:每場戰鬥開始免費一次反擊格擋");
  if (S.familyWeapons.grandpashout) situational.push("家族武器「爺爺之媽個巴基」:boss大絕招必定被擋下(每場戰鬥1次)");
  return { total: S.livesMax, items, comboCut, situational };
}

    <h2 style="margin-top:14px;">🔍 目前卡關的字${weak.length?`(依答錯次數排序${weak.length>WEAK_SHOW_LIMIT?`，只列前${WEAK_SHOW_LIMIT}個`:""})`:""}</h2>
    ${weak.length===0 ? `<div class="sub">目前沒有積欠中的錯題，很棒！</div>` : weak.slice(0,WEAK_SHOW_LIMIT).map(w=>{

// 絕招描述要走 petSigGroupOf(),才顯示得出「專精轉換」換過去的效果,而不是家族的原始絕招
const PET_SIG_GROUP_DESC = {
  counterImmune: "boss下次反擊小機率直接失效", doubleProc: "自動攻擊小機率觸發第二次",
  lifeRecover: "命中時小機率回復1點命數", dot: "自動攻擊附加持續傷害", procBoost: "自動攻擊觸發機率提升",
};
function petSigDesc(fid, pet){
  const g = petSigGroupOf(fid, pet);
  if (!pet.sigOverride) return PET_SIGNATURE[fid];
  return "(專精轉換)" + PET_SIG_GROUP_DESC[g];
}
function petTraitsText(pet){
  if (!pet.traits || !pet.traits.length) return "無";
  return pet.traits.map(id=>{
    const t = PET_TRAITS.find(x=>x.id===id);
    return t ? `${t.emoji}${t.name}(${t.desc})` : id;
  }).join("、");
}

  const fam = MONSTER_FAMILIES.find(f=>f.id===fid);

    <div>${active?`<button onclick="setActivePet('${fid}')">收回</button>`

      ${starCost!=null?`<button ${marks<starCost?"disabled":""} onclick="starUpPet('${fid}')">突破🏅${starCost}</button>`:""}
      ${pet.star>=PET_RETRAIT_STAR&&!pet.retraitUsed?`<button onclick="retraitPet('${fid}')">洗天賦</button>`:""}
      ${pet.lv>=10?`<button ${S.petFeed<PET_RESPEC_SIG_COST?"disabled":""} onclick="respecPetSig('${fid}')">轉專精🍖${PET_RESPEC_SIG_COST}</button>`:""}</div></div>`;
}
// 出戰欄位改成多隻(依角色等級決定名額):已出戰的按鈕收回,未出戰的若還有空位才能加入
function setActivePet(fid){
  const idx = S.activePetIds.indexOf(fid);
  if (idx>=0) { S.activePetIds.splice(idx,1); }
  else if (S.activePetIds.length < petSlotCount(S.charLevel)) { S.activePetIds.push(fid); }
  saveGame(); render();
}
function feedPet(fid){
  const pet=S.pets[fid]; const cost=petFeedCostFor(pet); if(S.petFeed<cost||pet.lv>=10) return;
  S.petFeed-=cost; pet.lv++; saveGame();
  towerSfx("pet"); // 寵物專屬音色,不再借用防禦音(音效會議建議:寵物要有辨識度)
  // Lv5 中繼里程碑:原本 Lv1~9 是九層無回饋的爬坡、所有價值壓在 Lv10 那一格,
  // 而多數玩家根本走不到 Lv10。這裡把懸崖切成兩階,Lv5 就先看得到絕招。
  floatText(pet.lv>=10 ? "🐾寵物覺醒!絕招轉為全效!" : pet.lv===PET_HALF_SIG_LV ? "🐾半效絕招解鎖!" : `🐾寵物升到 Lv${pet.lv}!`);
  render();
}
// ★突破:材料是馴服印記(重複馴服該家族拿到),不跟飼料搶資源
function starUpPet(fid){
  const pet=S.pets[fid]; const cost=petStarCost(pet.star);
  if (cost==null || (S.petMarks[fid]||0) < cost) return;
  S.petMarks[fid] -= cost; pet.star++;
  saveGame(); towerSfx("pet");
  floatText(pet.star>=PET_STAR_MAX ? "🌟究極型!寵物突破到 ★5!" : `🌟寵物突破到 ★${pet.star}!`);
  render();
}
// 洗天賦(★2 起,每隻一次):避免「抽到廢天賦卻是這個家族唯一一隻」的絕望感
function retraitPet(fid){
  const pet=S.pets[fid];
  if (pet.star < PET_RETRAIT_STAR || pet.retraitUsed) return;
  pet.traits = randomPetTraits(); pet.retraitUsed = true;
  saveGame(); towerSfx("pet"); floatText("🎲天賦重抽!");

}
// 專精轉換(Lv10 起):在5組絕招之間輪換。16家族壓成5組原本是重複感的來源,開放自由配
// 之後翻轉成優點(可組出「保命4隻+輸出2隻」的隊伍),同時給封頂後只進不出、
// 必然變成死貨幣的 🍖 一個永久去化口。
function respecPetSig(fid){
  const pet=S.pets[fid];
  if (pet.lv<10 || S.petFeed<PET_RESPEC_SIG_COST) return;
  const cur = petSigGroupOf(fid, pet);
  const next = PET_SIG_GROUP_LIST[(PET_SIG_GROUP_LIST.indexOf(cur)+1) % PET_SIG_GROUP_LIST.length];
  pet.sigOverride = (next === PET_SIG_GROUP[fid]) ? null : next;
  S.petFeed -= PET_RESPEC_SIG_COST;
  saveGame(); towerSfx("pet"); floatText(`🔄專精轉換:${PET_SIG_GROUP_DESC[next]}`);
  render();
}

function renderTowerMap(){
  const cleared = Math.min(S.floor-1, FLOOR_CAP);
  const cells = [];
  for (let f=1; f<=FLOOR_CAP; f++){
    const rk = rankOf(f).key;
    const isCleared = f<=cleared;
    const isCurrent = f===S.floor && S.floor<=FLOOR_CAP;
    let icon = "";
    if (isMonarch(f)) icon = "👑";
    else if (isDecadeKing(f)) icon = "⚔️";
    else if (isGolemFloor(f)) icon = "🗿";
    else if (isCleared) icon = "✓";
    const clickable = isCleared && !isCurrent;
    cells.push(`<div class="mapCell rank-${rk} ${isCleared?"cleared":""} ${isCurrent?"current":""}"
      title="第${f}層・${rankOf(f).name}${isCleared?"(已通關,點擊前往回聲之塔重打)":isCurrent?"(目前所在樓層)":"(尚未抵達)"}"
      ${clickable?`onclick="startEcho(${f})"`:""}>
      <span class="mapFloorNum">${f}</span><span class="mapIcon">${isCurrent?"▶":icon}</span>
    </div>`);

  app.innerHTML = `<div class="card"><h1>🗺️ 塔地圖</h1>

// ---------- 每日修行 ----------
function openDaily(){
  if (isDailyTimeLimitReached()) { alert("今天的遊戲時間已經用完了,明天再來吧!"); view="home"; render(); return; }
  const today = new Date().toDateString();
  if (S.lastDailyDate === today) { alert("今天已經修行過了,明天再來!"); return; }
  const due = dueMistakeWords(); // 跟強制複習門檻同一套判定,不再把「還沒複習到第二次的新字」也當成待複習
  const clearedMax = Math.max(1, (S.floor-1)*20);
  const pool = due.length>=6 ? WORDS.filter(w=>due.includes(w.word)).slice(0,6)
    : shuffle(WORDS.slice(0, clearedMax)).slice(0,6);
  quizState = { phase:"wave", variant:null, pool, order:shuffle(pool), idx:0, streak:0, waveMistakes:0, isDaily:true };
  view="daily"; render();
}
function renderDaily(){
  const qs=quizState;
  if (qs.idx>=qs.order.length){ dailyDone(); return; }
  renderQuestion(qs.order[qs.idx], qs.pool, (correct)=>{
    if(correct){ qs.streak++; } else qs.streak=0;
    qs.idx++;
    render();
  }, false);
}
function dailyDone(){
  const today = new Date().toDateString();
  S.dailyStreak = (S.dailyStreak||0)+1;
  S.lastDailyDate = today;
  const bonus = dailyStreakBonus(S.dailyStreak);
  S.mods += bonus;
  // 家族武器「奶奶之絞肉蒸蛋」:每次完成每日修行,額外恢復1點命數
  window.__grandmaHeal = false;
  if (S.familyWeapons.grandmaegg && S.livesCur < S.livesMax) { S.livesCur++; window.__grandmaHeal = true; }
  const newFamilyWeapons = grantFamilyWeapons(); // 連續天數可能剛好在這次跨過門檻(奶奶之絞肉蒸蛋)
  const newAchievements = grantAchievements(); // 連續天數可能剛好在這次跨過成就門檻(持之以恆)
  saveGame();
  // view 要先切到安全狀態(home)再手刻這個完成畫面的innerHTML:如果之後有任何非按鈕觸發的
  // render()呼叫,至少會落回首頁而不是重跑 dailyDone() 本身、重複發獎勵
  view = "home";
  app.innerHTML = `<div class="card"><h1>📅 每日修行完成</h1>
    <div class="sysmsg">連續修行 ${S.dailyStreak} 天!</div>
    <div class="row"><span>獎勵</span><span>🔧 +${bonus}</span></div>
    ${window.__grandmaHeal?`<div class="sysmsg">🍳『奶奶之絞肉蒸蛋讓你恢復了1點命數。』</div>`:""}
    ${familyWeaponUnlockHtml(newFamilyWeapons)}
    ${achievementUnlockHtml(newAchievements)}
    <button class="primary" onclick="render()">返回</button></div>`;
}

function startEcho(f){
  if (isDailyTimeLimitReached()) { view="home"; render(); return; }
  // 101層以後沒有固定的「第f層=第f批20字」切片(那套是1-100層的機制),回聲重打改成
  // 從該樓層所屬主題區域抽樣,並沿用cloze變格,不然pool會是空的、直接自動判定完成
  const f100Plus = f > 100;
  const pool = f100Plus
    ? pickExpeditionWords(expeditionRegionWords(WORDS, regionForFloor(f)), S.expedition.usage, 10)
    : shuffle(floorWords(f)).slice(0,10);
  quizState = { phase:"wave", variant:f100Plus?"cloze":null, pool, order:pool, idx:0, streak:0, waveMistakes:0, echoFloor:f, noProgress:true,
    region: f100Plus ? regionForFloor(f) : null };
  view="echoQuiz"; render();
}
function renderEchoQuiz(){
  const qs=quizState;
  if (qs.idx>=qs.order.length){ echoDone(); return; }
  renderQuestion(qs.order[qs.idx], qs.pool, (correct)=>{ if(correct) qs.streak++; else qs.streak=0; qs.idx++; render(); }, false);
}
function echoDone(){
  const reward = 15 + Math.floor(Math.random()*20);
  S.mods += reward; saveGame();
  view = "home"; // 同 dailyDone():先切安全狀態,避免非按鈕觸發的render()重複發獎勵
  app.innerHTML = `<div class="card"><h1>🌀 回聲之塔完成</h1><div class="row"><span>獎勵</span><span>🔧 +${reward}</span></div>
    <button class="primary" onclick="render()">返回</button></div>`;
}

// ---------- 秘寶詞卷(補充字彙複習池:跟回聲之塔/試煉之塔一樣是零風險複習,不扣命、
// 不影響本傳進度/錯題本、不給主線經驗值(noProgress)——但範圍不是「已通關樓層」,而是
// words.js尾端額外追加的64補充字(topic==="bonus",見floorWords/cumulativeWords的切法
// 完全不會碰到這批字,玩家不會透過爬塔「學到」它們,所以永遠不會出現在主線教學/錯題本裡)。
// 從一開始就解鎖(不看S.floor),因為這批字跟主線教學進度無關;但比照其他複習模式一樣
// 尊重每日遊玩時間鎖(timeLocked)——那是家長的安全機制,不該被複習模式繞過。
// 首次全清給一次性稀有貨幣(虹彩結晶,平常只能靠試煉之塔傳說級機率取得),
// 用 S.bonusVaultCleared 當守門旗標防止重複領取;之後可以重玩複習,但沒有獎勵。 ----------
const BONUS_VAULT_FIRST_CLEAR_SHARDS = 3;
function renderBonusVault(){
  const words = bonusVaultWords();
  app.innerHTML = `<div class="card"><h1>📜 秘寶詞卷</h1>
    <div class="sysmsg">『測試者,這是課本以外的補充詞彙——跟主線100層無關,零風險複習:不扣命、不影響本傳進度/錯題本。』</div>
    <div class="sub">收錄字數:${words.length} 個</div>
    ${S.bonusVaultCleared
      ? `<div class="sub">✅ 已完整複習過一次,首通獎勵已領取。歡迎隨時回來複習,但不會再重複發獎。</div>`
      : `<div class="sysmsg">🌟『第一次完整複習完這卷字,會有特別的獎賞。』</div>`}
    <button class="primary" ${words.length?"":"disabled"} onclick="startBonusVault()">開始複習(${words.length}題)</button>
    <button onclick="view='home';render()">返回</button></div>`;
}
function startBonusVault(){
  if (isDailyTimeLimitReached()) { view="home"; render(); return; }
  const pool = shuffle(bonusVaultWords());
  if (!pool.length) { view="home"; render(); return; }
  quizState = { phase:"wave", variant:null, pool, order:pool, idx:0, streak:0, waveMistakes:0, bonusVaultMode:true, noProgress:true };
  view="bonusVaultQuiz"; render();
}
function renderBonusVaultQuiz(){
  const qs=quizState;
  if (qs.idx>=qs.order.length){ bonusVaultDone(); return; }
  renderQuestion(qs.order[qs.idx], qs.pool, (correct)=>{ if(correct) qs.streak++; else qs.streak=0; qs.idx++; render(); }, false);
}
function bonusVaultDone(){
  const firstClear = !S.bonusVaultCleared;
  if (firstClear) {
    S.trialItems.iridescent_shard = (S.trialItems.iridescent_shard||0) + BONUS_VAULT_FIRST_CLEAR_SHARDS;
    S.bonusVaultCleared = true; // 一次性旗標,設完之後同一存檔再也不會走進這個if
  }
  saveGame();
  towerSfx("victory");
  view = "home"; // 先切安全狀態,避免非按鈕觸發的render()重跑bonusVaultDone()重複發獎勵(同dailyDone/echoDone模式)
  app.innerHTML = `<div class="card"><h1>📜 秘寶詞卷完成</h1>
    ${firstClear
      ? `<div class="sysmsg">🌟『補充詞卷已經完整複習過一遍——這份榮耀只有第一次算數。』</div>
         <div class="row"><span>首通特別獎勵</span><span>💎 虹彩結晶 x${BONUS_VAULT_FIRST_CLEAR_SHARDS}</span></div>
         <div class="sub">虹彩結晶可以在🛒試煉兌換所直接讓一隻寵物變成異色版。</div>`
      : `<div class="sysmsg">『複習完成,補充詞卷已經全部看過一輪。』</div>
         <div class="sub">已複習 ${quizState.order.length} 個字(重玩不會重複發放首通獎勵)。</div>`}
    <button class="primary" onclick="render()">返回</button></div>`;
}

// ---------- 錯題複習(小朋友反饋:錯題要有地方複習,複習完要能拿到寵物) ----------
// 只算真的答錯過的字(everWrong),不含「第一次就答對,只是還沒湊滿畢業次數」的正常新字
function dueMistakeCount(){
  return Object.keys(S.mistakeBook).filter(w=>S.mistakeBook[w].everWrong && !S.mistakeBook[w].graduated).length;
}
function tameRandomFamily(){
  const notOwned = MONSTER_FAMILIES.filter(f=>!S.pets[f.id]);
  if (!notOwned.length) return null;
  const fam = notOwned[Math.floor(Math.random()*notOwned.length)];
  S.pets[fam.id] = { lv:1, kills:0 };
  if (S.activePetIds.length < petSlotCount(S.charLevel)) S.activePetIds.push(fam.id);
  return fam;
}
// 只挑真的答錯過的字(everWrong)進複習,不含「第一次就答對,只是還沒湊滿畢業次數」的正常新字
function dueMistakeWords(){
  return Object.keys(S.mistakeBook).filter(w=>S.mistakeBook[w].everWrong && !S.mistakeBook[w].graduated);
}
// ---------- 塔內異象:70層以上隨機出現的「複習10題」事件(家長需求 §2)----------
// 跟主動的錯題複習(openMistakeReview)最大的差別:這裡是**固定10題就結束**,不是清到
// 全畢業才放人。完成即給獎、答錯不扣命——複習應該被獎勵,不該被當成路障。
function startOmenReview(){
  const ever = everWrongWords();
  const pool = shuffle(WORDS.filter(w=>ever.includes(w.word))).slice(0, OMEN_REVIEW_LEN);
  if (!pool.length) { view="intro"; render(); return; }
  quizState = { phase:"wave", variant:"listen", pool, order:pool, idx:0, streak:0, waveMistakes:0,
    isMistakeReview:true, omenMode:true };
  view="omenReview"; render();
}
function renderOmenReview(){
  const qs=quizState;
  if (qs.idx>=qs.order.length){ omenReviewDone(); return; }
  if (qs.idx===0 && !qs.__introShown){
    qs.__introShown = true;
    app.innerHTML = `<div class="card">
      <h1>🌫️ 塔內異象</h1>
      <div class="sysmsg">『測試者,這一層的空氣裡浮著你遺忘的字。<br>
        通過 ${OMEN_REVIEW_LEN} 道回響,異象就會散去——答錯不會扣命數,放心。』</div>
      <button class="primary" onclick="quizState.__ready=true;render()">開始</button></div>`;
    return;
  }
  if (!qs.__ready && qs.idx===0){ qs.__ready=true; }
  renderQuestion(qs.order[qs.idx], qs.pool, (correct)=>{
    if(correct) qs.streak++; else { qs.streak=0; qs.waveMistakes++; }
    qs.idx++; render();
  }, false);
}
function omenReviewDone(){
  const perfect = quizState.waveMistakes===0;
  const mods = (perfect?120:60) + Math.floor(Math.random()*40);
  S.mods += mods;
  const gotScroll = perfect ? 1 : 0;
  S.scrolls = (S.scrolls||0) + gotScroll;
  saveGame();
  app.innerHTML = `<div class="card">
    <h1>🌤️ 異象散去</h1>
    <div class="sysmsg">『回響平息了。你想起來的東西,比你以為的多。』</div>
    <div class="row"><span>複習題數</span><span>${OMEN_REVIEW_LEN} 題(答錯 ${quizState.waveMistakes} 題)</span></div>
    <div class="row"><span>獎勵</span><span>🔧${mods}${gotScroll?" ＋ 📜殘卷 ×1(全對獎勵)":""}</span></div>
    <button class="primary" onclick="view='intro';render()">繼續爬塔</button></div>`;
}

// ---------- 殘卷:讓一個還沒畢業的錯題字直接畢業(史詩怪掉落)----------
// 目的是讓錯題本從「債」變成「可消費的戰利品」——小孩會為了拿殘卷去找史詩怪,
// 為了用殘卷去打開錯題本看自己到底欠了哪些字。
function renderScrollUse(){
  const words = dueMistakeWords();
  const list = WORDS.filter(w=>words.includes(w.word));
  app.innerHTML = `<div class="card"><h1>📜 黑巫師的殘卷</h1>
    <div class="sysmsg">『殘卷會替你記住一個字。用掉一張,那個字就直接從錯題本畢業。』</div>
    <div class="sub">持有殘卷:📜 ${S.scrolls||0} 張 ｜ 未畢業錯題:${list.length} 個</div>
    ${list.length
      ? list.map(w=>`<div class="gearRow"><div><b>${w.word}</b><div class="sub">${w.zh_tw}</div></div>
          <div><button onclick="useScroll('${escapeStr(w.word)}')">📜 使用</button></div></div>`).join("")
      : `<div class="sysmsg">目前沒有未畢業的錯題,殘卷先留著吧。</div>`}
    <button onclick="view='home';render()">返回</button></div>`;
}
function useScroll(word){
  if ((S.scrolls||0) <= 0) return;
  const rec = S.mistakeBook[word];
  if (!rec || rec.graduated) return;
  S.scrolls--;
  rec.graduated = true; rec.streak = Math.max(rec.streak, 2);
  saveGame();
  floatText(`📜『「${word}」已經從錯題本畢業了。』`);
  render();
}

function openMistakeReview(){
  if (isDailyTimeLimitReached()) { view="home"; render(); return; }
  const words = dueMistakeWords();
  if (!words.length) { alert("目前沒有需要複習的錯題,再多闖幾層吧!"); return; }
  const pool = shuffle(WORDS.filter(w=>words.includes(w.word)));
  // 小朋友反饋「打字常常打不進去、判斷不出來」:拼字模式在部分裝置上輸入體驗不好,
  // 改回選擇題,但不是退回最早期那種純隨機四選一(容易亂猜蒙混)——干擾選項優先從
  // 「其他也在錯題本裡的字」出(見renderQuestion的reversePool邏輯),選項本身就更容易混淆,
  // 加上連續答對2次才畢業(§mistakeBookOnAnswer),亂猜要連續矇對兩次的機率仍然偏低
  quizState = { phase:"wave", variant:"listen", pool, order:pool, idx:0, streak:0, waveMistakes:0, isMistakeReview:true };
  view="mistakeReview"; render();
}
function renderMistakeReview(){
  const qs=quizState;
  if (qs.idx>=qs.order.length){
    // 一輪問完,檢查錯題本是不是已經全部畢業;還有沒畢業的字就再排一輪繼續複習,
    // 直到真的清空為止,才算「複習完畢」給寵物獎勵
    const remaining = dueMistakeWords();
    // 防呆:錯題本裡若殘留 WORDS 中已不存在的字(例如字表換版),下面的 filter 會撈到空陣列,
    // 而 remaining 又永遠不會變空 → renderMistakeReview 會無限自我遞迴直到爆堆疊。
    // 用「真的排得出題目」當續行條件,不是用「還有沒畢業的字」。
    const remainingPool = WORDS.filter(w=>remaining.includes(w.word));
    if (remainingPool.length) {
      const pool = shuffle(remainingPool);
      quizState = { phase:"wave", variant:"listen", pool, order:pool, idx:0, streak:0, waveMistakes:0, isMistakeReview:true };
      render();
    } else {
      mistakeReviewDone();
    }
    return;
  }
  renderQuestion(qs.order[qs.idx], qs.pool, (correct)=>{ if(correct) qs.streak++; else qs.streak=0; qs.idx++; render(); }, false);
}
function mistakeReviewDone(){
  const tamed = tameRandomFamily();
  // 小朋友反饋:錯題複習要能累積成就感——每完整複習3次(不限單次錯題本大小),
  // 額外開一個保底史詩寶物(神秘寶物),鼓勵持續回來清錯題本而不是只圖一次寵物獎勵
  S.mistakeReviewCount = (S.mistakeReviewCount||0) + 1;
  window.__mysteryTreasure = null;
  if (S.mistakeReviewCount % 3 === 0) {
    const mods = 90 + Math.floor(Math.random()*61); // 90~150,對齊史詩寶物區間
    S.mods += mods;
    window.__mysteryTreasure = mods;
  }
  // 家族武器「媽媽之怒」:錯題畢業數可能剛好在這次複習跨過門檻,即時檢查解鎖
  const newFamilyWeapons = grantFamilyWeapons();
  // 成就「複習達人」:完整複習次數可能剛好在這次跨過門檻
  const newAchievements = grantAchievements();
  saveGame();
  towerSfx("victory");
  view = "home"; // 先切安全狀態,避免非按鈕觸發的render()重複發獎勵(同dailyDone/echoDone)
  app.innerHTML = `<div class="card"><h1>📝 錯題複習完成</h1>
    <div class="sysmsg">『錯題本已經全部清空,做得好,測試者。』</div>
    ${tamed ? `<div class="sysmsg">✨『${tamed.emoji} ${tamed.name} 被你的堅持感動,加入了你的寵物牧場!』</div>`
      : `<div class="sub">目前所有妖魔家族都已經被馴服了,這次沒有新寵物,但改裝點/經驗值都有正常累積。</div>`}
    ${window.__mysteryTreasure ? `<div class="sysmsg">🎁『累積第 ${S.mistakeReviewCount} 次複習,神秘寶物出現了!獲得秘密武器材料 🔧+${window.__mysteryTreasure}!』</div>` : `<div class="sub">再複習 ${3-(S.mistakeReviewCount%3)} 次可以開出神秘寶物。</div>`}
    ${familyWeaponUnlockHtml(newFamilyWeapons)}
    ${achievementUnlockHtml(newAchievements)}
    <button class="primary" onclick="render()">返回</button></div>`;
}

// ---------- 試煉之塔(獨立複習關卡:第三個「類複習」模式,跟錯題複習/回聲之塔明確不重複——
// 出題範圍是已通關樓層的字(含錯題本),不扣命/不動錯題本/不動樓層進度,只給經驗值,
// 結算roll一個輕量物資,拿到兌換所換🔧🍖或直接免費升一級)----------
function trialClearedCount(){ return S.floor - 1; }
function renderTrialTower(){
  const cleared = trialClearedCount();
  const ti = S.trialItems;
  app.innerHTML = `<div class="card"><h1>🏯 試煉之塔</h1>
    ${cleared<=0 ? `<div class="sub">尚未通關任何樓層,先爬過第1層再回來試煉。</div>` : `
    <div class="sysmsg">出題範圍:已通關的 ${cleared} 層字彙(含錯題本)。零風險——不扣命、不影響本傳進度/錯題本,答對照樣給經驗值,結算開出一份輕量物資。</div>
    <div class="row"><span>🔩 廢棄零件</span><span>x${ti.junk_common}</span></div>
    <div class="row"><span>⚙️ 稀有改裝核心</span><span>x${ti.junk_rare}</span></div>
    <div class="row"><span>💎 史詩銘印晶石</span><span>x${ti.key_epic}</span></div>
    <div class="row"><span>🌟 傳說遺物核心</span><span>x${ti.key_legendary}</span></div>
    <button class="primary" onclick="startTrial()">開始一輪試煉(${TRIAL_RUN_LEN}題)</button>
    <button onclick="view='trialShop';render()">🛒 前往兌換所</button>
    `}
    <button onclick="view='home';render()">返回</button></div>`;
}
function startTrial(){
  if (isDailyTimeLimitReached()) { view="home"; render(); return; }
  const cleared = trialClearedCount();
  if (cleared<=0) return;
  const pool = shuffle(cumulativeWords(cleared)).slice(0, TRIAL_RUN_LEN);
  quizState = { phase:"wave", variant:null, pool, order:pool, idx:0, streak:0, waveMistakes:0, trialMode:true, noProgress:true };
  view="trialQuiz"; render();
}
function renderTrialQuiz(){
  const qs=quizState;
  if (qs.idx>=qs.order.length){ trialDone(); return; }
  renderQuestion(qs.order[qs.idx], qs.pool, (correct)=>{ if(correct) qs.streak++; else qs.streak=0; qs.idx++; render(); }, false);
}
function trialDone(){
  const roll = rollTrialItem(curRank().key, S.trialPity, totalLuckPct());
  S.trialItems[roll.itemId] = (S.trialItems[roll.itemId]||0) + 1;
  S.trialPity = roll.nextPity;
  saveGame();
  towerSfx("victory");
  view = "home"; // 先切安全狀態,避免非按鈕觸發的render()重跑trialDone()重複發獎勵(同dailyDone/echoDone模式)
  const item = TRIAL_ITEMS.find(i=>i.id===roll.itemId);
  app.innerHTML = `<div class="card"><h1>🏯 試煉之塔完成</h1>
    <div class="sysmsg">『試煉結束,經驗值已入帳。』</div>
    <div class="row"><span>獲得物資(${roll.tier})</span><span>${item.emoji}${item.name} x1</span></div>
    <button class="primary" onclick="render()">返回</button></div>`;
}

// ---------- 試煉兌換所:把物資轉成🔧/🍖,或用史詩/傳說物品直接換一次免費升級 ----------
// 捷徑只是mods等值轉換的UX包裝,不是對buyWeapon/levelUpWeapon/upgradeGear新增材料閘門——
// 這裡直接改S.weaponLv/S.gear,做的事跟levelUpWeapon/upgradeGear一樣,只是不扣S.mods
function trialEpicShortcutTarget(){
  const list = curWeaponList().filter(w=>(S.weaponLv[w.id]||0)>0 && S.weaponLv[w.id]<WEAPON_MAX_LV);
  if (!list.length) return null;
  return list.find(w=>w.id===S.weaponId) || list[0];
}
function trialLegendaryShortcutTarget(){
  return GEAR_SLOTS.find(slot=>(S.gear[slot]||1)<3) || null;
}
function redeemTrialItem(itemId, mode){
  const item = TRIAL_ITEMS.find(i=>i.id===itemId);
  if (!item || !S.trialItems[itemId]) return;
  if (mode==="mods") {
    if (!item.modsValue) return; // 虹彩結晶沒有mods兌換值,不能被這個模式消耗掉
    S.trialItems[itemId]--; S.mods += trialItemRedeemMods(itemId);
  } else if (mode==="feed") {
    if (!item.feedValue) return;
    S.trialItems[itemId]--; S.petFeed += trialItemRedeemFeed(itemId);
  } else if (mode==="shortcut") {
    if (itemId==="key_epic") {
      const w = trialEpicShortcutTarget();
      if (!w) return;
      S.trialItems[itemId]--; S.weaponLv[w.id] = (S.weaponLv[w.id]||1) + 1;
    } else if (itemId==="key_legendary") {
      const slot = trialLegendaryShortcutTarget();
      if (!slot) return;
      S.trialItems[itemId]--; S.gear[slot] = (S.gear[slot]||1) + 1;
      if (slot==="armor") recomputeLivesMax();
    } else return;
  } else return;
  saveGame(); render();
}
// ---------- 合成系統(延伸試煉之塔物資,3個低階換1個高階,只往上合成不做拆解防套利)----------
function craftTrialItem(itemId){
  const recipe = TRIAL_FUSION_RECIPES[itemId];
  if (!recipe || (S.trialItems[itemId]||0) < recipe.need) return;
  S.trialItems[itemId] -= recipe.need;
  S.trialItems[recipe.into] = (S.trialItems[recipe.into]||0) + 1;
  saveGame(); render();
}
// 虹彩結晶(合成終端產物)唯一用途:讓一隻已馴服、還不是異色版的寵物直接變成異色版
// (異色版的機制本身早就存在——觸發機率+30%/CSS發光——這裡只是新增一條「保證取得」的
// 途徑,不用純靠馴服當下的機率運氣,零新UI/新視覺,純粹重用既有系統)
function useIridescentShard(famId){
  if ((S.trialItems.iridescent_shard||0) < 1) return;
  const pet = S.pets[famId];
  if (!pet || pet.shiny) return;
  S.trialItems.iridescent_shard--; pet.shiny = true;
  saveGame(); towerSfx("pet"); render();
}
function renderTrialShop(){
  const shards = S.trialItems.iridescent_shard||0;
  const nonShinyPets = Object.keys(S.pets).filter(fid=>!S.pets[fid].shiny);
  app.innerHTML = `<div class="card"><h1>🛒 試煉兌換所</h1>
    <div class="sub">把試煉之塔拿到的物資換成🔧改裝點/🍖寵物飼料,史詩/傳說物品也可以直接換一次免費升級,
      或合成升級成更高階的物資</div>
    ${TRIAL_ITEMS.map(renderTrialItemRow).join("")}
    ${shards>0 ? `<div class="sysmsg">🌈 你有 ${shards} 個虹彩結晶,可以讓一隻寵物直接變成異色版:
        ${nonShinyPets.length ? nonShinyPets.map(fid=>{
          const fam = MONSTER_FAMILIES.find(f=>f.id===fid);
          return `<button onclick="useIridescentShard('${fid}')">${familySpriteHtml(fid,"familySprite")}讓${fam.name}變異色</button>`;
        }).join("") : `<span class="tag">所有寵物都已經是異色版了</span>`}
      </div>` : ""}
    <button onclick="view='trialTower';render()">返回試煉之塔</button></div>`;
}
function renderTrialItemRow(item){
  const count = S.trialItems[item.id]||0;
  let shortcutBtn = "";
  if (item.id==="key_epic") {
    const w = trialEpicShortcutTarget();
    shortcutBtn = w ? `<button ${count<=0?"disabled":""} onclick="redeemTrialItem('key_epic','shortcut')">🗡️免費升級「${w.name}」</button>`
      : `<span class="tag">目前沒有可升級的武器</span>`;
  } else if (item.id==="key_legendary") {
    const slot = trialLegendaryShortcutTarget();
    shortcutBtn = slot ? `<button ${count<=0?"disabled":""} onclick="redeemTrialItem('key_legendary','shortcut')">🎽免費升級「${GEAR_DATA[slot].name}」</button>`
      : `<span class="tag">裝備已全部滿階</span>`;
  }
  const recipe = TRIAL_FUSION_RECIPES[item.id];
  const craftBtn = recipe ? (() => {
    const targetItem = TRIAL_ITEMS.find(i=>i.id===recipe.into);
    return `<button ${count<recipe.need?"disabled":""} onclick="craftTrialItem('${item.id}')">🔨合成(${recipe.need}個→${targetItem.emoji}${targetItem.name})</button>`;
  })() : "";
  return `<div class="weapon"><div><b>${item.emoji} ${item.name}</b><span class="tag">${item.rarity}</span>
      <div class="sub">庫存 x${count}</div></div>
    <div>
      ${item.modsValue?`<button ${count<=0?"disabled":""} onclick="redeemTrialItem('${item.id}','mods')">兌換🔧</button>`:""}
      ${item.feedValue?`<button ${count<=0?"disabled":""} onclick="redeemTrialItem('${item.id}','feed')">兌換🍖</button>`:""}
      ${craftBtn}
      ${shortcutBtn}
    </div></div>`;
}

render();
</script>
